name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Code quality and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  desktop:
    name: macOS desktop smoke test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:electron
      - run: pnpm --filter @ai/desktop package
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: desktop-smoke-test
          path: |
            apps/desktop/.artifacts/
            apps/desktop/test-results/
          include-hidden-files: true
          retention-days: 7
