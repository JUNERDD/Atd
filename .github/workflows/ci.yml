name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Runs every job, including the Intel packaging rehearsal, on the chosen branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Code quality and production build
    runs-on: ubuntu-latest
    steps:
      # This workflow copy belongs to the permanent diagnostic branch. The existing Protect
      # main ruleset requires this job, so even renamed/intermediate branches cannot merge it.
      - name: Reject diagnostic history targeting main
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          echo "::error::Diagnostic history must never merge into main. Reimplement production fixes on a fresh branch from main."
          exit 1
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks 8.30.1
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          tool_dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$tool_dir"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$tool_dir/gitleaks.tar.gz"
          echo "$GITLEAKS_SHA256  $tool_dir/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$tool_dir/gitleaks.tar.gz" -C "$tool_dir" gitleaks
          echo "$tool_dir" >> "$GITHUB_PATH"
      - name: Scan tracked snapshot and introduced commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          snapshot=$(mktemp -d "$RUNNER_TEMP/privacy-snapshot.XXXXXX")
          trap 'rm -rf "$snapshot"' EXIT
          git archive HEAD | tar -x -C "$snapshot"
          gitleaks dir "$snapshot" --config "$GITHUB_WORKSPACE/.gitleaks.toml" \
            --redact --verbose --no-banner --ignore-gitleaks-allow
          scan_range="$HEAD_SHA"
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            scan_range="$BASE_SHA..$HEAD_SHA"
          fi
          # After a history rewrite, the old push base may no longer be fetchable.
          # Scan all reachable head history in that case, including removed values.
          gitleaks git --log-opts="$scan_range" --config .gitleaks.toml \
            --redact --verbose --no-banner --ignore-gitleaks-allow
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Serves turbo's remote cache from the GitHub Actions cache, one entry per task hash, so
      # tasks whose inputs did not change replay their logs and outputs instead of running again.
      # GitHub evicts the least recently used entries. Pinned to the v2.5.1 commit: a
      # third-party action that can write this repository's cache.
      - uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7
      # On Linux this skips the Swift and Rust checks (scripts/on-macos.mjs); the swift and rust
      # jobs run them.
      - run: pnpm check

  # A pull request runs the Swift and Rust checks only when it touches their inputs; a push to
  # main always runs both. The Intel packaging rehearsal follows `package` on release/ branches.
  changes:
    name: Detect changed areas
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      swift: ${{ steps.filter.outputs.swift }}
      rust: ${{ steps.filter.outputs.rust }}
      package: ${{ steps.filter.outputs.package }}
    steps:
      - id: filter
        uses: dorny/paths-filter@v4.0.3
        with:
          # Besides each area's sources: the bridge and widget contracts Swift codegen reads, and
          # what decides how the checks run (scripts, tool pins, lockfile, this workflow).
          filters: |
            shared: &shared
              - .github/workflows/ci.yml
              - .node-version
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - turbo.json
            swift:
              - *shared
              - apps/macos/**
              - apps/desktop/src/native-bridge/*schema.json
              - packages/agent-contracts/**
            rust:
              - *shared
              - crates/**
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
              - scripts/check-rust-file-length.mjs
              - packages/file-index/**
            # Everything the Release app packs: the shell, the service and its workspace packages
            # (packages/file-index among them), the renderer and the Rust addon's crates.
            package:
              - *shared
              - apps/macos/**
              - apps/agent-service/**
              - apps/desktop/**
              - packages/**
              - crates/**
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml

  # The Swift and Rust checks run as two parallel macOS jobs instead of one after the other.
  swift:
    name: Swift checks
    needs: changes
    # `changes` is skipped on push, which must not skip this job.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.swift == 'true') }}
    # Pinned rather than macos-latest: the native shell targets macOS 26 and Xcode 26.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      # No pnpm store cache: the small set of tools and schema dependencies downloads faster
      # than the full store restores on macOS.
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      # The same Xcode as local development, so `swift format` and SwiftLint judge the same way.
      - name: Select Xcode 26.3
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app
          xcodebuild -version
          swift --version
      - name: Install XcodeGen and SwiftLint
        run: |
          for tool in xcodegen swiftlint; do
            command -v "$tool" > /dev/null || brew install "$tool"
          done
          xcodegen --version
          swiftlint version
      # Widget codegen imports agent-contracts source, including its TypeBox dependency.
      - run: pnpm install --frozen-lockfile --filter atd --filter @atd/agent-contracts...
      # check:swift serializes swift test and xcodebuild, which share SwiftPM's artifact cache.
      - name: Swift checks (codegen, format, lint, test, build)
        run: pnpm check:swift

  rust:
    name: Rust checks
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true') }}
    # The file index watches folders with FSEvents, so it builds and tests on macOS only.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      # No dependencies to install: check:rust runs a Node built-ins script and cargo.
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      # With no argument, rustup installs the toolchain rust-toolchain.toml pins, with its
      # components (rustfmt, clippy) and targets.
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install
          cargo --version
      # Caches the registry and the compiled dependencies; the workspace crates always rebuild.
      # Only main saves, so pull requests reuse its cache without each storing their own copy.
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust checks (file length, fmt, clippy, test)
        run: pnpm check:rust

  # AIShellTests on the oldest supported system. The image defaults to Xcode 16.4 (Swift 6.1);
  # the package needs Swift 6.2, so the job selects the Xcode 26.3 the image also carries. Not part
  # of the required summary check.
  swift-macos-15:
    name: Swift tests on macOS 15
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.swift == 'true') }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode 26.3
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app
          xcodebuild -version
          swift --version
          sw_vers -productVersion
      - name: Swift tests
        working-directory: apps/macos
        run: swift test

  # Packages the Release app natively on Intel as the release workflow does, but unsigned (ad
  # hoc) and without secrets, then checks it with verify-app.mjs and the app's own Node. It runs
  # on pull requests from release/ branches that touch the app's inputs and on manual runs; it is
  # not part of the required summary check.
  intel-package:
    name: Intel packaging rehearsal
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || (startsWith(github.head_ref, 'release/') && needs.changes.outputs.package == 'true')) }}
    runs-on: macos-26-intel
    steps:
      - name: Check the runner architecture
        run: |
          echo "$(uname -m), macOS $(sw_vers -productVersion)"
          [ "$(uname -m)" = x86_64 ]
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Select Xcode 26.3
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app
          xcodebuild -version
      - name: Install XcodeGen
        run: command -v xcodegen > /dev/null || brew install xcodegen
      # The file index is a Rust addon that `bundle` builds for the host.
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install
          cargo --version
      - run: pnpm install --frozen-lockfile
      # With no AI_CODE_SIGN_IDENTITY, project.yml signs ad hoc; build.mjs targets the host (x64).
      - name: Build the Release app
        run: pnpm --filter @atd/macos build:release
      - name: Verify the app
        run: |
          app=apps/macos/DerivedData/Build/Products/Release/Atd.app
          key=$(sed -n 's/^ *SUPublicEDKey: *//p' apps/macos/project.yml | head -n 1)
          "$app/Contents/Resources/node/bin/node" apps/macos/scripts/verify-app.mjs app \
            --app "$app" \
            --feed-url https://downloads.atd.best/appcast-x64.xml \
            --arm64-feed-url https://downloads.atd.best/appcast.xml \
            --public-ed-key "$key"

  # The "Protect main" ruleset requires a status check with this exact name, so this job keeps
  # the id and name of the former single macOS job. It passes when each macOS job passed or was
  # skipped because the pull request does not touch its inputs; a failed change detection fails
  # it, since that also skips both jobs.
  desktop:
    name: macOS desktop smoke test
    needs: [changes, swift, rust]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the Swift and Rust checks
        env:
          CHANGES: ${{ needs.changes.result }}
          SWIFT: ${{ needs.swift.result }}
          RUST: ${{ needs.rust.result }}
          RUN_SWIFT: ${{ github.event_name != 'pull_request' || needs.changes.outputs.swift == 'true' }}
          RUN_RUST: ${{ github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true' }}
        run: |
          echo "Change detection: $CHANGES, Swift checks: $SWIFT, Rust checks: $RUST"
          if [ "$CHANGES" = failure ]; then exit 1; fi
          expected() { if [ "$1" = true ]; then echo success; else echo skipped; fi; }
          [ "$SWIFT" = "$(expected "$RUN_SWIFT")" ] && [ "$RUST" = "$(expected "$RUN_RUST")" ]
