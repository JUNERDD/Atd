name: Build and verify one release architecture

on:
  workflow_call:
    inputs:
      arch:
        type: string
        required: true
      marketing_version:
        type: string
        required: true
      build_version:
        type: string
        required: true
      notarize:
        description: Notarize and staple the signed app and disk image with Apple Notary Service.
        type: boolean
        default: true
    outputs:
      dmg-id:
        value: ${{ jobs.package.outputs.artifact-id }}
    secrets:
      DEVELOPER_ID_P12:
        required: true
      DEVELOPER_ID_P12_PASSWORD:
        required: true
      NOTARY_APPLE_ID:
        required: true
      NOTARY_APP_PASSWORD:
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  VERSION: ${{ inputs.marketing_version }}
  BUILD_VERSION: ${{ inputs.build_version }}
  RELEASE_ARCH: ${{ inputs.arch }}
  RELEASE_MACHINE: ${{ inputs.arch == 'arm64' && 'arm64' || 'x86_64' }}

jobs:
  build:
    name: Build and sign the app
    runs-on: ${{ inputs.arch == 'arm64' && 'macos-26' || 'macos-26-intel' }}
    timeout-minutes: 70
    outputs:
      artifact-id: ${{ steps.app.outputs.artifact-id }}
    env:
      DEVELOPER_ID_SHA1: ${{ vars.DEVELOPER_ID_SHA1 }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - name: Check the runner architecture
        run: |
          echo "$(uname -m), macOS $(sw_vers -productVersion)"
          [ "$(uname -m)" = "$RELEASE_MACHINE" ]
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # Reuse setup-node's exact store key when available. Saving a cold PR-scoped
      # cache here would hold up notarization after the signed app is uploaded.
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore the pnpm store
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: node-cache-${{ runner.os }}-${{ inputs.arch }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
      # The project's Xcode, which the macos-26 and macos-26-intel images both carry.
      - name: Select Xcode 26.3
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app
          xcodebuild -version
      - name: Install XcodeGen
        run: command -v xcodegen > /dev/null || brew install xcodegen
      # The service's file index is a Rust addon that `bundle` builds through turbo; with no
      # argument, rustup installs the toolchain rust-toolchain.toml pins for the host.
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install
          cargo --version
      - run: pnpm install --frozen-lockfile
      # Separate secret names leave legacy branches and installed users' EdDSA trust intact.
      - name: Import Developer ID credentials
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: node apps/macos/scripts/signing/ci.mjs --skip-notarize
      # The trailing argument reaches prepare-service-pack.mjs, the last command of `bundle`: the
      # add-on lock it embeds names this version's GitHub release assets.
      - name: Bundle the service, the renderer and the add-ons
        run: pnpm --filter @atd/macos bundle --marketing-version "$VERSION"
      # build.mjs maps the architecture, sets the x64 feed URL and overrides the versions. The
      # build version is passed only when it differs from the marketing version, as a prerelease's
      # does (its `-` dropped); otherwise project.yml derives it from the marketing version.
      - name: Build the Release app
        run: |
          mkdir -p "$RUNNER_TEMP/release-diagnostics"
          args=(--configuration Release --arch "$RELEASE_ARCH" --marketing-version "$VERSION" --timing-summary)
          if [ "$BUILD_VERSION" != "$VERSION" ]; then args+=(--build-version "$BUILD_VERSION"); fi
          node apps/macos/scripts/build.mjs "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/release-diagnostics/xcodebuild.log"
          {
            echo "### Xcode timing: $RELEASE_ARCH"
            echo '```text'
            awk '/Build Timing Summary/{show=1} show' "$RUNNER_TEMP/release-diagnostics/xcodebuild.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check the built app
        run: |
          app=apps/macos/DerivedData/Build/Products/Release/Atd.app
          echo "APP=$app" >> "$GITHUB_ENV"
          check() {
            built=$(/usr/libexec/PlistBuddy -c "Print :$2" "$1/Contents/Info.plist")
            if [ "$built" != "$3" ]; then
              echo "::error::$(basename "$1")'s $2 is $built, not $3."
              exit 1
            fi
          }
          # Sparkle compares CFBundleVersion, the feed's sparkle:version; the widget shares it.
          check "$app" CFBundleShortVersionString "$VERSION"
          check "$app" CFBundleVersion "$BUILD_VERSION"
          for appex in "$app"/Contents/PlugIns/*.appex; do
            check "$appex" CFBundleVersion "$BUILD_VERSION"
          done
          executable="$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          archs=$(lipo -archs "$executable")
          if [ "$archs" != "$RELEASE_MACHINE" ]; then
            echo "::error::The main executable holds '$archs', not $RELEASE_MACHINE."
            exit 1
          fi
          codesign --verify --deep --strict "$app"
          node apps/macos/scripts/signing/check.mjs "$app"
      # The lock inside the signed app must be the one the archives were packed with; the archives
      # are then checked against it with the app's own Node.
      - name: Check the add-ons against the app's lock
        run: |
          lock="$APP/Contents/Resources/agent-service/addons.lock.json"
          node="$APP/Contents/Resources/node/bin/node"
          cmp "$lock" tmp/addons-release/addons.lock.json
          "$node" apps/macos/scripts/verify-app.mjs addons --node "$node" --lock "$lock" \
            --dir tmp/addons-release --arch "$RELEASE_ARCH"
      - name: Remove temporary signing credentials
        if: always()
        run: node apps/macos/scripts/signing/ci.mjs --cleanup
      - name: Archive the signed app and add-ons
        run: bash apps/macos/scripts/release/app-handoff.sh archive "$APP" tmp/addons-release "$RUNNER_TEMP/checkpoint"
      - name: Upload the signed app and add-ons
        id: app
        uses: actions/upload-artifact@v7.0.1
        with:
          name: signed-app-${{ inputs.arch }}
          path: ${{ runner.temp }}/checkpoint/
          overwrite: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload release diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-build-diagnostics-${{ inputs.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-diagnostics/
          if-no-files-found: warn
          retention-days: 7

  notarize:
    name: Notarize the app
    needs: build
    runs-on: macos-26
    timeout-minutes: 55
    outputs:
      artifact-id: ${{ steps.app.outputs.artifact-id }}
    env:
      DEVELOPER_ID_SHA1: ${{ vars.DEVELOPER_ID_SHA1 }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - name: Download the signed app and add-ons
        uses: actions/download-artifact@v8.0.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/signed
      - name: Verify and restore the signed app handoff
        run: bash apps/macos/scripts/release/app-handoff.sh restore "$RUNNER_TEMP/signed" "$RUNNER_TEMP/restored"
      - name: Import Developer ID and notarization credentials
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
        run: |
          args=()
          if [ "${{ inputs.notarize }}" != "true" ]; then args+=(--skip-notarize); fi
          node apps/macos/scripts/signing/ci.mjs "${args[@]}"
      - name: Notarize and staple the app
        if: inputs.notarize
        timeout-minutes: 40
        run: |
          node apps/macos/scripts/signing/notarize.mjs "$RUNNER_TEMP/signed/Atd.app.zip" "$APP"
          node apps/macos/scripts/signing/check.mjs "$APP" --notarized
      - name: Remove temporary signing credentials
        if: always()
        run: node apps/macos/scripts/signing/ci.mjs --cleanup
      - name: Archive the verified app and add-ons
        run: bash apps/macos/scripts/release/app-handoff.sh archive "$APP" "$RUNNER_TEMP/signed" "$RUNNER_TEMP/checkpoint"
      - name: Upload the verified app and add-ons
        id: app
        uses: actions/upload-artifact@v7.0.1
        with:
          name: app-${{ inputs.arch }}
          path: ${{ runner.temp }}/checkpoint/
          overwrite: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  package:
    name: Package and notarize the dmg
    needs: notarize
    # DMG layout and signatures use the architecture of the archived app. No app code runs here.
    runs-on: macos-26
    timeout-minutes: 90
    outputs:
      artifact-id: ${{ steps.dmg.outputs.artifact-id }}
    env:
      DEVELOPER_ID_SHA1: ${{ vars.DEVELOPER_ID_SHA1 }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - name: Download the verified app and add-ons
        uses: actions/download-artifact@v8.0.0
        with:
          artifact-ids: ${{ needs.notarize.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/handoff
      - name: Verify and restore the notarized app handoff
        run: bash apps/macos/scripts/release/app-handoff.sh restore "$RUNNER_TEMP/handoff" "$RUNNER_TEMP/restored"
      - name: Import Developer ID and notarization credentials
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
        run: |
          args=()
          if [ "${{ inputs.notarize }}" != "true" ]; then args+=(--skip-notarize); fi
          node apps/macos/scripts/signing/ci.mjs "${args[@]}"
      - name: Build, sign and notarize the dmg
        timeout-minutes: 75
        run: |
          venv="$RUNNER_TEMP/dmgbuild"
          python3 -m venv "$venv"
          "$venv/bin/pip" install --quiet --require-hashes -r apps/macos/dmg/requirements.txt
          mkdir -p "$RUNNER_TEMP/release-diagnostics"
          args=(--dmg-only --app "$APP" --out dist)
          if [ "${{ inputs.notarize }}" != "true" ]; then args+=(--skip-notarize); fi
          DMG_PYTHON="$venv/bin/python" node apps/macos/scripts/signing/distribute.mjs "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/release-diagnostics/distribution.log"
          (cd dist && shasum -a 256 -c "Atd-$VERSION-$RELEASE_ARCH.dmg.sha256")
      - name: Remove temporary signing credentials
        if: always()
        run: node apps/macos/scripts/signing/ci.mjs --cleanup
      # The lock pins each archive's digest, so the archives need no .sha256 files of their own.
      - name: Stage the add-ons beside the dmg
        run: |
          cp "$RUNNER_TEMP/handoff"/Atd-addon-*.tar.gz dist/
          cp "$RUNNER_TEMP/handoff"/addons.lock.json "dist/addons-$RELEASE_ARCH.lock.json"
          ls -l dist
      - name: Upload the dmg and add-ons
        id: dmg
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dmg-${{ inputs.arch }}
          overwrite: true
          path: dist/
          if-no-files-found: error
          # The dmg is already compressed.
          compression-level: 0
          retention-days: 7

      - name: Upload release diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-dmg-diagnostics-${{ inputs.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-diagnostics/
          if-no-files-found: warn
          retention-days: 7

  verify:
    name: Verify the installer on macOS 15
    needs: package
    runs-on: ${{ inputs.arch == 'arm64' && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 20
    env:
      DMG: Atd-${{ inputs.marketing_version }}-${{ inputs.arch }}.dmg
    steps:
      - name: Check the runner architecture
        run: |
          echo "$(uname -m), macOS $(sw_vers -productVersion)"
          [ "$(uname -m)" = "$RELEASE_MACHINE" ]
      # verify-app.mjs uses Node built-ins and the Command Line Tools only, so no install is needed.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.0
        with:
          artifact-ids: ${{ needs.package.outputs.artifact-id }}
          merge-multiple: true
          path: dmg
      - name: Check the dmg's digest
        working-directory: dmg
        run: shasum -a 256 -c "$DMG.sha256"
      # The mount point must not contain a space; the volume name ("Atd <version>") does.
      - name: Copy the app out of the dmg
        run: |
          mount="$RUNNER_TEMP/atd-dmg"
          app="$RUNNER_TEMP/verify/Atd.app"
          case "$mount$app" in *' '*)
            echo "::error::$RUNNER_TEMP contains a space."
            exit 1
            ;;
          esac
          mkdir -p "$mount" "$(dirname "$app")"
          hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$mount" "dmg/$DMG"
          ditto "$mount/Atd.app" "$app"
          hdiutil detach "$mount"
          echo "APP=$app" >> "$GITHUB_ENV"
      - name: Verify the app
        env:
          AI_CODE_SIGN_IDENTITY: ${{ vars.DEVELOPER_ID_SHA1 }}
          AI_DEVELOPMENT_TEAM: ${{ vars.APPLE_TEAM_ID }}
          FEED_URL: ${{ inputs.arch == 'arm64' && 'https://downloads.atd.best/appcast.xml' || 'https://downloads.atd.best/appcast-x64.xml' }}
        run: |
          for pair in "CFBundleShortVersionString=$VERSION" "CFBundleVersion=$BUILD_VERSION"; do
            built=$(plutil -extract "${pair%%=*}" raw "$APP/Contents/Info.plist")
            if [ "$built" != "${pair#*=}" ]; then
              echo "::error::The app's ${pair%%=*} is $built, not ${pair#*=}."
              exit 1
            fi
          done
          node apps/macos/scripts/signing/check.mjs "$APP"
          key=$(sed -n 's/^ *SUPublicEDKey: *//p' apps/macos/project.yml | head -n 1)
          "$APP/Contents/Resources/node/bin/node" apps/macos/scripts/verify-app.mjs app \
            --app "$APP" \
            --feed-url "$FEED_URL" \
            --arm64-feed-url https://downloads.atd.best/appcast.xml \
            --public-ed-key "$key"
      - name: Verify the app and dmg notarization tickets
        if: inputs.notarize
        run: |
          xcrun stapler validate "$APP"
          spctl --assess --type execute "$APP"
          xcrun stapler validate "dmg/$DMG"
          spctl --assess --type open --context context:primary-signature "dmg/$DMG"
      # The archives the app will download, checked on the oldest supported system against the
      # lock the installed app carries: the app's Node runs the worker.
      - name: Verify the add-ons
        env:
          ADDON_ARCH: ${{ inputs.arch }}
        run: |
          lock="$APP/Contents/Resources/agent-service/addons.lock.json"
          node="$APP/Contents/Resources/node/bin/node"
          cmp "$lock" "dmg/addons-$ADDON_ARCH.lock.json"
          "$node" apps/macos/scripts/verify-app.mjs addons --node "$node" --lock "$lock" \
            --dir dmg --arch "$ADDON_ARCH"
      # Reuse the verified x64 Release bundle. Only the test driver is compiled here; the app
      # and its embedded service are neither rebuilt nor re-signed. A failure gates collect.
      - name: Compile the Intel Release smoke driver
        if: inputs.arch == 'x64'
        env:
          ATD_SMOKE_EVIDENCE: ${{ runner.temp }}/intel-macos15-smoke
        run: |
          set -o pipefail
          mkdir -p "$ATD_SMOKE_EVIDENCE"
          xcrun swiftc -swift-version 6 -parse-as-library -target x86_64-apple-macos15.0 \
            apps/macos/Tests/ReleaseSmoke/AppDriver.swift \
            -o "$RUNNER_TEMP/atd-smoke-driver" 2>&1 | tee "$ATD_SMOKE_EVIDENCE/driver-build.log"
      - name: Test Intel Release startup and core functions
        if: inputs.arch == 'x64'
        timeout-minutes: 8
        env:
          ATD_SMOKE_DRIVER: ${{ runner.temp }}/atd-smoke-driver
          ATD_SMOKE_EVIDENCE: ${{ runner.temp }}/intel-macos15-smoke
        run: |
          set -o pipefail
          "$APP/Contents/Resources/node/bin/node" --test --test-reporter=tap \
            apps/macos/Tests/ReleaseSmoke/harness.test.mjs \
            apps/macos/Tests/ReleaseSmoke/release-smoke.test.mjs \
            2>&1 | tee "$ATD_SMOKE_EVIDENCE/tests.tap"
      - name: Confirm smoke tests preserved the bundle signature
        if: always() && inputs.arch == 'x64' && env.APP != ''
        run: codesign --verify --deep --strict "$APP"
      - name: Upload Intel macOS 15 smoke evidence
        if: always() && inputs.arch == 'x64'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: intel-macos15-smoke-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/intel-macos15-smoke/
          if-no-files-found: warn
          retention-days: 7
