name: Release

# Bumping `version` in apps/macos/package.json on main publishes a GitHub Release `v<version>`
# with the arm64 dmg of the Release app. The app is signed with the project's self-signed release
# certificate and not notarized (until Developer ID signing lands), so a downloaded copy is opened
# once from Privacy & Security. Installed copies update themselves with Sparkle (AppUpdater): each release
# also publishes `appcast.xml` with the dmg's EdDSA signature made with the `SPARKLE_ED_PRIVATE_KEY`
# secret (the private half of `SUPublicEDKey` in project.yml). That feed names the GitHub asset and
# serves installs whose `SUFeedURL` is still the latest release's; the mirror job then republishes
# it on R2, pointing at the verified mirror copy, for the `SUFeedURL` current builds read. A
# prerelease is never the latest release and is never mirrored, so it is not offered.
# A push that leaves the version as it was builds nothing, even when that version has no release
# yet. A manual run releases the current version unless its tag exists: use it for a first
# release without a bump, or to retry a release whose build failed.
on:
  push:
    branches: [main]
    paths: [apps/macos/package.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Detect version bump
    # A manual run from another branch must not tag and publish unreviewed code.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The version before the push is read from `github.event.before`.
          fetch-depth: 0
      - id: version
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          version=$(node -p "require('./apps/macos/package.json').version")
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::apps/macos/package.json version '$version' is not semver."
            exit 1
          fi
          # The app bundle reads its version from project.yml, so a release must not name a
          # version the bundle does not carry.
          marketing=$(sed -n 's/^ *MARKETING_VERSION: *//p' apps/macos/project.yml | head -n 1)
          if [ "$marketing" != "$version" ]; then
            echo "::error::MARKETING_VERSION '$marketing' in apps/macos/project.yml differs from package.json version '$version'."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A push releases only a version bump; other edits to package.json (dependencies,
          # scripts) do not. An unreadable previous manifest falls through to the tag check.
          if [ "$EVENT" = push ]; then
            previous=$(git show "$BEFORE:apps/macos/package.json" 2> /dev/null \
              | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version" 2> /dev/null \
              || true)
            if [ "$previous" = "$version" ]; then
              echo "The push kept version $version; nothing to release." >> "$GITHUB_STEP_SUMMARY"
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          # --exit-code returns 2 only when the tag is absent; any other failure stops the run.
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null || status=$?
          case $status in
            0)
              echo "v$version is already released; nothing to build." >> "$GITHUB_STEP_SUMMARY"
              echo "release=false" >> "$GITHUB_OUTPUT"
              ;;
            2) echo "release=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac

  release:
    name: Publish v${{ needs.version.outputs.version }}
    needs: version
    if: needs.version.outputs.release == 'true'
    # Pinned like the CI desktop job: the native shell targets macOS 26 and Xcode 26. The app is
    # arm64 only, so one runner builds the one installer.
    runs-on: macos-26
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # The SHA-1 of the self-signed release certificate. It is public: every signed app names it
      # in its designated requirement.
      RELEASE_SIGNING_SHA1: 2CB9D1EA2DA706E7C5B422E6A80AA48638FE83E9
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Select Xcode 26.3
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app
          xcodebuild -version
      - name: Install XcodeGen
        run: command -v xcodegen > /dev/null || brew install xcodegen
      # The service's file index is a Rust addon that `bundle` builds through turbo; with no
      # argument, rustup installs the toolchain rust-toolchain.toml pins.
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install
          cargo --version
      - run: pnpm install --frozen-lockfile
      # TCC records an Accessibility or Screen Recording grant with the app's designated
      # requirement. An ad hoc build's requirement is its cdhash, so every update dropped the
      # grants; this certificate makes it `identifier "com.junerdd.ai" and certificate leaf =
      # H"<SHA-1>"`, the same for every release. A different certificate drops every installed
      # copy's grants once (StaleGrantRecovery asks again), so the step accepts only this one.
      # `RELEASE_SIGNING_P12` is its base64 PKCS#12, `RELEASE_SIGNING_P12_PASSWORD` the password.
      # The certificate is public (apps/macos/release-certificate.pem); only its private key is
      # kept outside the repository, and apps/macos/scripts/restore-release-signing.mjs packs the
      # two under a new password and sets both secrets again.
      # codesign finds an identity only in a keychain on the search list; a self-signed
      # certificate needs no trust settings to sign.
      - name: Import the release signing certificate
        env:
          RELEASE_SIGNING_P12: ${{ secrets.RELEASE_SIGNING_P12 }}
          RELEASE_SIGNING_P12_PASSWORD: ${{ secrets.RELEASE_SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$RELEASE_SIGNING_P12" ] || [ -z "$RELEASE_SIGNING_P12_PASSWORD" ]; then
            echo "::error::The RELEASE_SIGNING_P12 secrets are missing; an ad hoc build would drop every installed copy's privacy grants."
            exit 1
          fi
          keychain="$RUNNER_TEMP/release-signing.keychain-db"
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          p12="$RUNNER_TEMP/release-signing.p12"
          printf '%s' "$RELEASE_SIGNING_P12" | base64 --decode > "$p12"
          security import "$p12" -k "$keychain" -P "$RELEASE_SIGNING_P12_PASSWORD" -T /usr/bin/codesign > /dev/null
          rm "$p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          # Ahead of the runner's own keychains, which stay on the list (xargs unquotes them).
          security list-keychains -d user | xargs security list-keychains -d user -s "$keychain"
          if ! security find-identity -p codesigning "$keychain" | grep -q "$RELEASE_SIGNING_SHA1"; then
            echo "::error::RELEASE_SIGNING_P12 does not hold the release certificate $RELEASE_SIGNING_SHA1."
            exit 1
          fi
          # project.yml signs with AI_CODE_SIGN_IDENTITY; the hash names an untrusted identity.
          echo "AI_CODE_SIGN_IDENTITY=$RELEASE_SIGNING_SHA1" >> "$GITHUB_ENV"
      - name: Build the Release app
        run: pnpm --filter @atd/macos build:release
      - name: Package the dmg
        run: |
          app=apps/macos/DerivedData/Build/Products/Release/Atd.app
          # Sparkle compares CFBundleVersion, so the appcast names this version for both.
          for key in CFBundleShortVersionString CFBundleVersion; do
            built=$(/usr/libexec/PlistBuddy -c "Print :$key" "$app/Contents/Info.plist")
            if [ "$built" != "$VERSION" ]; then
              echo "::error::The built app's $key is $built, not $VERSION."
              exit 1
            fi
          done
          codesign --verify --deep --strict "$app"
          # Installed copies keep their privacy grants only under this exact requirement.
          leaf=$(printf '%s' "$RELEASE_SIGNING_SHA1" | tr 'A-F' 'a-f')
          expected="identifier \"com.junerdd.ai\" and certificate leaf = H\"$leaf\""
          requirement=$(codesign -d -r- "$app" 2> /dev/null | sed -n 's/^designated => //p')
          if [ "$requirement" != "$expected" ]; then
            echo "::error::The app's designated requirement is '$requirement', not '$expected'."
            exit 1
          fi
          # dmgbuild lays out the installer window (apps/macos/dmg): the background, icon
          # positions and the Applications link, written straight into the image's .DS_Store
          # without driving Finder. build.py corrects its background bookmark before compression;
          # dmgbuild is pinned by hash in its own virtual environment.
          venv="$RUNNER_TEMP/dmgbuild"
          python3 -m venv "$venv"
          "$venv/bin/pip" install --quiet --require-hashes -r apps/macos/dmg/requirements.txt
          mkdir dist
          DMG_PYTHON="$venv/bin/python" node apps/macos/dmg/package.mjs "$app" "dist/Atd-$VERSION-arm64.dmg"
          # Keep the README's latest/download URL stable while Sparkle uses the versioned asset.
          cp "dist/Atd-$VERSION-arm64.dmg" dist/Atd-arm64.dmg
          ls -lh dist
      - name: Write the update feed
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          REPO: ${{ github.repository }}
          # The Sparkle the app embeds (Package.swift), whose sign_update signs the dmg.
          SPARKLE: 2.10.0
          SPARKLE_SHA256: c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c
        run: |
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "::error::The SPARKLE_ED_PRIVATE_KEY secret is missing; installed apps would reject an unsigned update."
            exit 1
          fi
          tools=$(mktemp -d "$RUNNER_TEMP/sparkle.XXXXXX")
          curl -fsSL -o "$tools/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE/Sparkle-$SPARKLE.tar.xz"
          echo "$SPARKLE_SHA256  $tools/sparkle.tar.xz" | shasum -a 256 -c -
          tar -xf "$tools/sparkle.tar.xz" -C "$tools"
          dmg="Atd-$VERSION-arm64.dmg"
          # Prints the enclosure's `sparkle:edSignature="…" length="…"` attributes.
          signature=$(printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$tools/bin/sign_update" --ed-key-file - "dist/$dmg")
          cat > dist/appcast.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Atd</title>
              <item>
                <title>$VERSION</title>
                <pubDate>$(LC_ALL=C date -u '+%a, %d %b %Y %H:%M:%S +0000')</pubDate>
                <sparkle:version>$VERSION</sparkle:version>
                <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>
                <link>https://github.com/$REPO/releases/tag/v$VERSION</link>
                <enclosure url="https://github.com/$REPO/releases/download/v$VERSION/$dmg" type="application/octet-stream" $signature/>
              </item>
            </channel>
          </rss>
          EOF
          cat dist/appcast.xml
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Creates the tag at the commit that was built. A prerelease version (1.2.0-beta.1)
        # is published as a prerelease so it never becomes the latest release.
        run: |
          flags=()
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes "Apple Silicon (arm64) build for macOS 26 or later. The app is not signed with an Apple Developer ID and not notarized: after downloading, open it once from System Settings › Privacy & Security. Installed copies of 0.4.0 or later update themselves." \
            --generate-notes \
            "${flags[@]}"

  mirror:
    name: Mirror the published stable download
    needs: [version, release]
    if: needs.release.result == 'success' && !contains(needs.version.outputs.version, '-')
    uses: ./.github/workflows/mirror-release.yml
    with:
      tag: v${{ needs.version.outputs.version }}
    secrets:
      R2_DOWNLOAD_ACCOUNT_ID: ${{ secrets.R2_DOWNLOAD_ACCOUNT_ID }}
      R2_DOWNLOAD_ACCESS_KEY_ID: ${{ secrets.R2_DOWNLOAD_ACCESS_KEY_ID }}
      R2_DOWNLOAD_SECRET_ACCESS_KEY: ${{ secrets.R2_DOWNLOAD_SECRET_ACCESS_KEY }}
