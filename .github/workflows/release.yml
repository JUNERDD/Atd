name: Release

# Bumping `version` in apps/macos/package.json on main publishes a GitHub Release `v<version>` with
# two native builds of the Release app for macOS 15 or later: Atd-<version>-arm64.dmg (Apple
# silicon, built on macos-26) and Atd-<version>-x64.dmg (Intel, built on macos-26-intel), plus the
# stable names Atd-arm64.dmg and Atd-x64.dmg. Both are Developer ID signed and notarized by Apple.
# The existing Sparkle EdDSA key continues to authorize updates from older installed copies.
# A macos-15 and a macos-15-intel job check each dmg with
# verify-app.mjs before anything is signed for Sparkle or published.
#
# Each build also packs that architecture's add-ons (the computer-use browser worker the app installs
# on demand; apps/macos/scripts/addons) and embeds the lock that pins them in the app. The archives
# (Atd-addon-<id>-<version>-<arch>.tar.gz) and each lock (addons-<arch>.lock.json, byte for byte
# the app's) ride the same draft as the dmgs, and the mirror uploads the archives to the
# content-addressed URL every lock names first (ops/release-downloads/README.md: Add-ons).
#
# Installed copies update themselves with Sparkle (AppUpdater). Each release carries one feed per
# architecture, `appcast.xml` (arm64) and `appcast-x64.xml`, whose enclosures carry the dmg's
# EdDSA signature made with the `SPARKLE_ED_PRIVATE_KEY` secret (the private half of
# `SUPublicEDKey` in project.yml). Both name the GitHub asset. `appcast.xml` stays the arm64 feed
# because installs of 0.4.0–0.7.9 read the latest release's `appcast.xml` from GitHub; 0.7.10 and
# later read the mirror's feeds, which the mirror job republishes on R2 pointing at its verified
# copies. A prerelease is never the latest release and never enters those feeds, so installed
# copies are not offered it. After every publish the mirror also moves the website's preview
# channel (`/rc/` on the mirror) to the newest published release, release candidate or stable.
#
# A push that leaves the version as it was builds nothing, even when that version has no release
# yet. A manual run on main in the default `release` mode releases the current version unless its
# tag exists: use it for a first release without a bump, or to retry a release whose build failed.
# On a `release/` branch the same run publishes only a prerelease version (such as 0.9.0-rc.1),
# tagged at that branch's commit; stable versions publish only from main. A manual run on any
# branch can instead use `artifacts` (build, verify and sign both dmgs and feeds into one workflow
# artifact; nothing is tagged, released or mirrored) or `rehearsal` (the same, then a draft release
# under a throwaway tag that is checked and always deleted).
# A version-bump PR builds a signed candidate in CI. On main, release automatically finds the
# merged PR's latest successful CI and promotes its verified immutable artifact when available.
# A missing/expired candidate uses the normal build path; an existing invalid candidate fails.
# Rehearsal can also discover an open PR's exact merge SHA without publishing or merging it.
# Explicit candidate_run_id remains available for a chosen manual candidate or PR candidate.
# Every promotion preserves the actual build commit and requires the same full repository tree.
on:
  push:
    branches: [main]
    paths: [apps/macos/package.json]
  workflow_dispatch:
    inputs:
      mode:
        description: release publishes from main (prereleases also from release/*); other modes never publish
        type: choice
        options: [release, artifacts, rehearsal, notarization-status]
        default: release
      marketing_version:
        description: artifacts/rehearsal only; shown version such as 0.9.0-rc.3 (default project.yml)
        type: string
        required: false
      build_version:
        description: artifacts/rehearsal only; CFBundleVersion without '-' such as 0.9.0rc.3
        type: string
        required: false
      candidate_run_id:
        description: optional explicit source run; otherwise discover the merged PR candidate automatically
        type: string
        required: false
      candidate_pr_number:
        description: PR number for an explicit source, or an optional PR hint for automatic rehearsal discovery
        type: string
        required: false
      notarization_submission_id:
        description: notarization-status only; the submission UUID printed by the signing job
        type: string
        required: false

permissions:
  contents: read

# Only a release-mode run on main (including a push) joins the publishing group, so a run on
# another branch can never displace a queued release; prerelease, artifact and rehearsal runs on
# another branch queue per branch. Read-only status queries run independently of those builds.
# The mirror serializes every channel's uploads itself.
concurrency:
  group: release-${{ inputs.mode == 'notarization-status' && format('notarization-{0}', github.run_id) || github.ref == 'refs/heads/main' && (inputs.mode || 'release') == 'release' && 'publish' || github.ref }}
  cancel-in-progress: false

# `shell: bash` adds pipefail, so a failing command inside a pipeline fails its step.
defaults:
  run:
    shell: bash

jobs:
  # The only place that decides the mode. It runs in every mode: a skipped job would skip every
  # job that needs it, so skipping cannot express a mode.
  version:
    name: Detect the version and mode
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      mode: ${{ steps.version.outputs.mode }}
      marketing_version: ${{ steps.version.outputs.marketing_version }}
      build_version: ${{ steps.version.outputs.build_version }}
      build: ${{ steps.version.outputs.build }}
      publish: ${{ steps.version.outputs.publish }}
      tree: ${{ steps.version.outputs.tree }}
      candidate-run-id: ${{ steps.candidate.outputs.run-id }}
      candidate-artifact-id: ${{ steps.candidate.outputs.artifact-id }}
      candidate-digest: ${{ steps.candidate.outputs.digest }}
      candidate-head-sha: ${{ steps.candidate.outputs.head-sha }}
      candidate-pr-number: ${{ steps.candidate.outputs.pr-number }}
      candidate-event: ${{ steps.candidate.outputs.event }}
      candidate-source-commit: ${{ steps.candidate.outputs.source-commit }}
      candidate-receipt-sha256: ${{ steps.candidate.outputs.receipt-sha256 }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The version before the push is read from `github.event.before`.
          fetch-depth: 0
          persist-credentials: false
      - id: version
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          MODE: ${{ inputs.mode || 'release' }}
          INPUT_MARKETING_VERSION: ${{ inputs.marketing_version }}
          INPUT_BUILD_VERSION: ${{ inputs.build_version }}
          NOTARIZATION_SUBMISSION_ID: ${{ inputs.notarization_submission_id }}
        run: |
          output() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          output tree "$(git rev-parse 'HEAD^{tree}')"
          case $MODE in
            release | artifacts | rehearsal | notarization-status) output mode "$MODE" ;;
            *)
              echo "::error::Unknown mode '$MODE'."
              exit 1
              ;;
          esac
          if [ "$MODE" = notarization-status ]; then
            uuid='^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'
            if ! [[ "$NOTARIZATION_SUBMISSION_ID" =~ $uuid ]]; then
              echo "::error::notarization-status requires a valid notarization_submission_id UUID."
              exit 1
            fi
            output build false
            output publish false
            echo "Read-only Apple notarization query; no build or publication." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          semver='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          version=$(node -p "require('./apps/macos/package.json').version")
          if ! [[ "$version" =~ $semver ]]; then
            echo "::error::apps/macos/package.json version '$version' is not semver."
            exit 1
          fi
          # The app bundle reads its version from project.yml, so a release must not name a
          # version the bundle does not carry.
          marketing=$(sed -n 's/^ *MARKETING_VERSION: *//p' apps/macos/project.yml | head -n 1)
          if [ "$marketing" != "$version" ]; then
            echo "::error::MARKETING_VERSION '$marketing' in apps/macos/project.yml differs from package.json version '$version'."
            exit 1
          fi
          if [ "$MODE" = release ]; then
            # A stable release publishes only reviewed code from main. A release branch may publish
            # a prerelease, which never becomes the latest release or enters the update feeds.
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              if [[ "$GITHUB_REF" != refs/heads/release/* ]]; then
                echo "::error::The release mode publishes only from main or a release/ branch; use artifacts or rehearsal on $GITHUB_REF_NAME."
                exit 1
              fi
              if [[ "$version" != *-* ]]; then
                echo "::error::$GITHUB_REF_NAME can publish only a prerelease such as $version-rc.1; stable $version publishes from main."
                exit 1
              fi
            fi
            if [ -n "$INPUT_MARKETING_VERSION$INPUT_BUILD_VERSION" ]; then
              echo "::error::A release takes its version from apps/macos/package.json; version inputs are for artifacts and rehearsal."
              exit 1
            fi
            output marketing_version "$version"
            # CFBundleVersion must not contain `-`, where Sparkle stops comparing, so a prerelease
            # builds without it: 0.9.1-rc.1 as 0.9.1rc.1, the form artifacts and rehearsal runs take.
            # Its identifiers must start with a letter for Sparkle to order it before the release
            # (0.9.1rc.1 < 0.9.1), where 0.9.1-0.2 would build as 0.9.10.2, a later version.
            build_version=${version//-/}
            if ! [[ "$build_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([A-Za-z][0-9A-Za-z]*(\.[0-9A-Za-z]+)*)?$ ]]; then
              echo "::error::Version '$version' has no build version that sorts before its release; start its prerelease part with a letter, such as -rc.1."
              exit 1
            fi
            output build_version "$build_version"
            publish=true
            # A push releases only a version bump; other edits to package.json (dependencies,
            # scripts) do not. An unreadable previous manifest falls through to the tag check.
            if [ "$EVENT" = push ]; then
              previous=$(git show "$BEFORE:apps/macos/package.json" 2> /dev/null \
                | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version" 2> /dev/null \
                || true)
              if [ "$previous" = "$version" ]; then
                echo "The push kept version $version; nothing to release." >> "$GITHUB_STEP_SUMMARY"
                publish=false
              fi
            fi
            if [ "$publish" = true ]; then
              # --exit-code returns 2 only when the tag is absent; any other failure stops the run.
              status=0
              git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null || status=$?
              case $status in
                0)
                  echo "v$version is already released; nothing to build." >> "$GITHUB_STEP_SUMMARY"
                  publish=false
                  ;;
                2) ;;
                *) exit "$status" ;;
              esac
            fi
            output build "$publish"
            output publish "$publish"
            exit 0
          fi
          # artifacts and rehearsal: the inputs, else project.yml's values. CURRENT_PROJECT_VERSION
          # is `$(MARKETING_VERSION)` there, which follows the marketing version in effect.
          marketing_version=${INPUT_MARKETING_VERSION:-$version}
          project_build=$(sed -n 's/^ *CURRENT_PROJECT_VERSION: *//p' apps/macos/project.yml | head -n 1)
          # shellcheck disable=SC2016 # The literal Xcode reference, not a command substitution.
          if [ "$project_build" = '$(MARKETING_VERSION)' ]; then project_build=$marketing_version; fi
          build_version=${INPUT_BUILD_VERSION:-$project_build}
          if ! [[ "$marketing_version" =~ $semver ]]; then
            echo "::error::marketing_version '$marketing_version' is not semver."
            exit 1
          fi
          # Sparkle ignores everything after `-`, so 0.9.0-rc.1 and 0.9.0-rc.2 would compare equal.
          if [[ "$build_version" == *-* ]]; then
            echo "::error::build_version '$build_version' contains '-'; pass one such as 0.9.0rc.3."
            exit 1
          fi
          if ! [[ "$build_version" =~ ^[0-9]+(\.[0-9A-Za-z]+)+$ ]]; then
            echo "::error::build_version '$build_version' is not a dot-separated version."
            exit 1
          fi
          output marketing_version "$marketing_version"
          output build_version "$build_version"
          output build true
          output publish false
          echo "$MODE run for $marketing_version (build $build_version); nothing is published." >> "$GITHUB_STEP_SUMMARY"
      - name: Resolve the verified release candidate
        if: steps.version.outputs.build == 'true'
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.candidate_run_id }}
          SOURCE_PR: ${{ inputs.candidate_pr_number }}
          MODE: ${{ steps.version.outputs.mode }}
          VERSION: ${{ steps.version.outputs.marketing_version }}
        run: |
          if [ "$MODE" = artifacts ]; then
            if [ -n "$SOURCE_RUN_ID$SOURCE_PR" ]; then
              echo "::error::artifacts builds a candidate; use rehearsal or release to promote one."
              exit 1
            fi
            exit 0
          fi
          if [ -n "$SOURCE_RUN_ID" ]; then
            node apps/macos/scripts/release/resolve-candidate.mjs \
              --repo "$GITHUB_REPOSITORY" --run-id "$SOURCE_RUN_ID" --commit "$GITHUB_SHA" --version "$VERSION" \
              --pr "$SOURCE_PR" --mode "$MODE"
          else
            node apps/macos/scripts/release/discover-candidate.mjs \
              --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --version "$VERSION" \
              --pr "$SOURCE_PR" --mode "$MODE"
          fi

  notarization-status:
    name: Inspect Apple notarization
    needs: version
    if: needs.version.outputs.mode == 'notarization-status'
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - name: Query the existing submission
        env:
          SUBMISSION_ID: ${{ inputs.notarization_submission_id }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          for name in NOTARY_APPLE_ID NOTARY_APP_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing $name."
              exit 1
            fi
          done
          xcrun notarytool info "$SUBMISSION_ID" \
            --apple-id "$NOTARY_APPLE_ID" --password "$NOTARY_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --output-format json \
            | jq '{id, name, status, createdDate}' > "$RUNNER_TEMP/notarization-status.json"
          cat "$RUNNER_TEMP/notarization-status.json"
          {
            echo '### Apple notarization status'
            echo '```json'
            cat "$RUNNER_TEMP/notarization-status.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  candidate:
    name: Build candidate
    needs: version
    if: needs.version.outputs.build == 'true' && needs.version.outputs.candidate-artifact-id == ''
    uses: ./.github/workflows/release-candidate.yml
    with:
      marketing_version: ${{ needs.version.outputs.marketing_version }}
      build_version: ${{ needs.version.outputs.build_version }}
    secrets:
      DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
      DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
      NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
      SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}

  # Builds the GitHub release as a draft, checks it by id and publishes it only when every check
  # passed. A rehearsal does the same under a throwaway tag and always deletes its draft.
  release:
    name: ${{ needs.version.outputs.mode == 'rehearsal' && 'Rehearse the release of' || 'Publish' }} v${{ needs.version.outputs.marketing_version }}
    needs: [version, candidate]
    if: >-
      always() && !cancelled() && needs.version.result == 'success' &&
      (needs.version.outputs.publish == 'true' || needs.version.outputs.mode == 'rehearsal') &&
      (needs.candidate.result == 'success' ||
      needs.version.outputs.candidate-artifact-id != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      VERSION: ${{ needs.version.outputs.marketing_version }}
      BUILD_VERSION: ${{ needs.version.outputs.build_version }}
      MODE: ${{ needs.version.outputs.mode }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CANDIDATE_RUN_ID: ${{ needs.version.outputs.candidate-run-id }}
      CANDIDATE_ARTIFACT_ID: ${{ needs.version.outputs.candidate-artifact-id }}
      CANDIDATE_DIGEST: ${{ needs.version.outputs.candidate-digest }}
      CANDIDATE_HEAD_SHA: ${{ needs.version.outputs.candidate-head-sha }}
      CANDIDATE_PR_NUMBER: ${{ needs.version.outputs.candidate-pr-number }}
      CANDIDATE_EVENT: ${{ needs.version.outputs.candidate-event }}
      SOURCE_COMMIT: ${{ needs.version.outputs.candidate-source-commit || github.sha }}
      TARGET_TREE: ${{ needs.version.outputs.tree }}
      CANDIDATE_RECEIPT_SHA256: ${{ needs.version.outputs.candidate-receipt-sha256 }}
    steps:
      - uses: actions/download-artifact@v8.0.0
        if: needs.version.outputs.candidate-artifact-id == ''
        with:
          artifact-ids: ${{ needs.candidate.outputs.artifact-id }}
          path: dist
      - name: Download and verify the immutable candidate
        if: needs.version.outputs.candidate-artifact-id != ''
        run: |
          archive="$RUNNER_TEMP/candidate.zip"
          gh api "repos/$GH_REPO/actions/artifacts/$CANDIDATE_ARTIFACT_ID/zip" > "$archive"
          printf '%s  %s\n' "${CANDIDATE_DIGEST#sha256:}" "$archive" | sha256sum --check
          unzip -q "$archive" -d dist
          echo "Reusing candidate run $CANDIDATE_RUN_ID, artifact $CANDIDATE_ARTIFACT_ID built at $SOURCE_COMMIT for release commit $GITHUB_SHA; complete source tree $TARGET_TREE matches." >> "$GITHUB_STEP_SUMMARY"
      - name: Check the artifact against its manifest
        run: |
          if [ -n "$CANDIDATE_RUN_ID" ]; then
            printf '%s  %s\n' "$CANDIDATE_RECEIPT_SHA256" dist/candidate-source.json | sha256sum --check
          fi
          jq -e --arg run "${CANDIDATE_RUN_ID:-$GITHUB_RUN_ID}" \
            --arg head "${CANDIDATE_HEAD_SHA:-$GITHUB_SHA}" \
            --arg event "${CANDIDATE_EVENT:-$GITHUB_EVENT_NAME}" \
            --argjson pr "${CANDIDATE_PR_NUMBER:-0}" \
            '.schemaVersion == 1 and .repository == env.GITHUB_REPOSITORY and
              .runId == $run and .commit == env.SOURCE_COMMIT and .tree == env.TARGET_TREE and .headSha == $head and
              .event == $event and .pullRequest == $pr' dist/candidate-source.json > /dev/null || {
            echo "::error::candidate-source.json does not identify the verified source run and commit."
            exit 1
          }
          jq -e --arg v "$VERSION" --arg b "$BUILD_VERSION" \
            '.marketingVersion == $v and .buildVersion == $b and .commit == env.SOURCE_COMMIT' \
            dist/manifest.json > /dev/null || {
            echo "::error::manifest.json names another version or commit."
            exit 1
          }
          for arch in arm64 x64; do
            dmg="Atd-$VERSION-$arch.dmg"
            want=$(jq -r --arg dmg "$dmg" '.artifacts[] | select(.dmg == $dmg) | .sha256' dist/manifest.json)
            got=$(sha256sum "dist/$dmg" | cut -d ' ' -f 1)
            if [ "$want" != "$got" ]; then
              echo "::error::$dmg's sha256 is $got, not the manifest's $want."
              exit 1
            fi
            # The README and the website link the unversioned names.
            cp "dist/$dmg" "dist/Atd-$arch.dmg"
          done
          # Every add-on archive is one an architecture's lock pins, with its digest, and the lock's
          # GitHub URL names this version's release asset (a rehearsal's throwaway tag aside).
          pinned=0
          for arch in arm64 x64; do
            while IFS=$'\t' read -r id addon_version addon_arch sha size url; do
              name="Atd-addon-$id-$addon_version-$addon_arch.tar.gz"
              if [ "$addon_arch" != "$arch" ] || [ "$url" != "https://github.com/JUNERDD/Atd/releases/download/v$VERSION/$name" ]; then
                echo "::error::addons-$arch.lock.json pins $name at $url."
                exit 1
              fi
              if [ "$(sha256sum "dist/$name" | cut -d ' ' -f 1)" != "$sha" ] || [ "$(stat -c %s "dist/$name")" != "$size" ]; then
                echo "::error::$name differs from addons-$arch.lock.json."
                exit 1
              fi
              pinned=$((pinned + 1))
            done < <(jq -r '.addons[] | [.id, .version, .arch, .sha256, .size, .urls[1]] | @tsv' "dist/addons-$arch.lock.json")
          done
          shipped=$(find dist -maxdepth 1 -name 'Atd-addon-*.tar.gz' | wc -l)
          if [ "$shipped" -ne "$pinned" ]; then
            echo "::error::dist holds $shipped add-on archives; the locks pin $pinned."
            exit 1
          fi
          if [ "$MODE" = rehearsal ]; then tag="v$VERSION-rehearsal.$GITHUB_RUN_ID"; else tag="v$VERSION"; fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          ls -l dist
      # A draft has no tag and no readers, so it is always rebuilt rather than reused; the API
      # allows several drafts with one tag name.
      - name: Delete leftover drafts
        run: |
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id" \
            | while read -r id; do
              echo "Deleting leftover draft $id"
              gh api -X DELETE "repos/$GH_REPO/releases/$id"
            done
      - name: Create the draft
        id: draft
        run: |
          notes="Atd-$VERSION-arm64.dmg is the Apple silicon (arm64) build and Atd-$VERSION-x64.dmg the Intel (x64) build; both run on macOS 15 or later. The app and disk image are Developer ID signed (Apple notarization is pending for a follow-up update, so first-time downloads may need Open Anyway in System Settings › Privacy & Security). Existing installs update through the same Sparkle signing key; macOS may request privacy permissions once after the signing identity migration. Installed copies update themselves: on Apple silicon from 0.4.0 or later, on Intel from 0.9.0 or later."
          if [[ "$VERSION" == *-* ]]; then
            notes="$notes This is a prerelease: installed stable copies are not offered it, and it updates itself to the next stable release, not to later prereleases."
          fi
          if [ -n "$CANDIDATE_RUN_ID" ]; then
            notes="$notes Built by candidate run $CANDIDATE_RUN_ID at $SOURCE_COMMIT; its complete source tree matches release commit $GITHUB_SHA."
          fi
          # The body precedes the generated notes, like `gh release create --notes --generate-notes`.
          gh api -X POST "repos/$GH_REPO/releases" \
            -F draft=true \
            -F generate_release_notes=true \
            -f tag_name="$TAG" \
            -f target_commitish="$GITHUB_SHA" \
            -f name="$TAG" \
            -f body="$notes" > "$RUNNER_TEMP/draft.json"
          id=$(jq -r .id "$RUNNER_TEMP/draft.json")
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "Created draft $id for $TAG"
      # By the draft's own upload URL, so the assets cannot land on another release with this tag.
      - name: Upload the assets
        run: |
          upload_url=$(jq -r '.upload_url | sub("\\{.*$"; "")' "$RUNNER_TEMP/draft.json")
          for file in dist/*.dmg dist/appcast.xml dist/appcast-x64.xml dist/Atd-addon-*.tar.gz dist/addons-*.lock.json; do
            printf 'header = "Authorization: Bearer %s"\n' "$GH_TOKEN" \
              | curl --config - --fail-with-body --silent --show-error \
                -H 'Accept: application/vnd.github+json' \
                -H 'Content-Type: application/octet-stream' \
                --data-binary "@$file" "$upload_url?name=$(basename "$file")" \
              | jq -r '"Uploaded \(.name): \(.size) bytes, \(.state)"'
          done
      - name: Check the draft
        env:
          DRAFT_ID: ${{ steps.draft.outputs.id }}
        run: |
          release="$RUNNER_TEMP/release.json"
          gh api "repos/$GH_REPO/releases/$DRAFT_ID" > "$release"
          jq -e --arg tag "$TAG" \
            '.draft and .tag_name == $tag and .name == $tag and .target_commitish == env.GITHUB_SHA' \
            "$release" > /dev/null || {
            echo "::error::Draft $DRAFT_ID is not an unpublished $TAG at $GITHUB_SHA."
            exit 1
          }
          expected=$({
            printf '%s\n' "Atd-$VERSION-arm64.dmg" "Atd-$VERSION-x64.dmg" Atd-arm64.dmg \
              Atd-x64.dmg appcast.xml appcast-x64.xml addons-arm64.lock.json addons-x64.lock.json
            (cd dist && ls Atd-addon-*.tar.gz)
          } | sort)
          actual=$(jq -r '.assets[].name' "$release" | sort)
          if [ "$expected" != "$actual" ]; then
            echo "::error::The draft holds [${actual//$'\n'/ }], not [${expected//$'\n'/ }]."
            exit 1
          fi
          while IFS= read -r name; do
            asset=$(jq -c --arg name "$name" '.assets[] | select(.name == $name)' "$release")
            want="sha256:$(sha256sum "dist/$name" | cut -d ' ' -f 1)"
            size=$(stat -c %s "dist/$name")
            if [ "$(jq -r .state <<< "$asset")" != uploaded ] || [ "$(jq -r .size <<< "$asset")" != "$size" ]; then
              echo "::error::$name is not fully uploaded: $asset"
              exit 1
            fi
            digest=$(jq -r '.digest // empty' <<< "$asset")
            if [ -z "$digest" ]; then
              gh api -H 'Accept: application/octet-stream' \
                "repos/$GH_REPO/releases/assets/$(jq -r .id <<< "$asset")" > "$RUNNER_TEMP/asset"
              digest="sha256:$(sha256sum "$RUNNER_TEMP/asset" | cut -d ' ' -f 1)"
            fi
            if [ "$digest" != "$want" ]; then
              echo "::error::$name on the draft has $digest, not the artifact's $want."
              exit 1
            fi
            echo "$name: $digest"
          done <<< "$expected"
      - name: Delete the rehearsal draft
        if: always() && needs.version.outputs.mode == 'rehearsal' && steps.draft.outputs.id != ''
        env:
          DRAFT_ID: ${{ steps.draft.outputs.id }}
        run: |
          gh api -X DELETE "repos/$GH_REPO/releases/$DRAFT_ID"
          if gh api "repos/$GH_REPO/releases/$DRAFT_ID" > /dev/null 2>&1; then
            echo "::error::Draft $DRAFT_ID still exists."
            exit 1
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" > /dev/null 2>&1; then
            echo "::error::The rehearsal left the tag $TAG."
            exit 1
          fi
          echo "Deleted draft $DRAFT_ID; no $TAG tag exists."
      # Publishing creates the tag at target_commitish. make_latest is a string enum (-f); a
      # prerelease version is published as a prerelease, which never becomes the latest release.
      - name: Publish the release
        if: needs.version.outputs.publish == 'true'
        env:
          DRAFT_ID: ${{ steps.draft.outputs.id }}
        run: |
          if [[ "$VERSION" == *-* ]]; then
            gh api -X PATCH "repos/$GH_REPO/releases/$DRAFT_ID" -F draft=false -F prerelease=true > /dev/null
          else
            gh api -X PATCH "repos/$GH_REPO/releases/$DRAFT_ID" -F draft=false -f make_latest=true > /dev/null
          fi
          tagged=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq .object.sha)
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::$TAG points at $tagged, not the built commit $GITHUB_SHA."
            exit 1
          fi
          if [[ "$VERSION" != *-* ]]; then
            latest=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
            if [ "$latest" != "$TAG" ]; then
              echo "::error::The latest release is $latest, not $TAG."
              exit 1
            fi
          fi
          echo "Published $TAG at $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"

  mirror:
    name: Mirror the published stable downloads
    needs: [version, release]
    if: >-
      always() && !cancelled() && needs.version.outputs.publish == 'true' &&
      needs.release.result == 'success' && !contains(needs.version.outputs.marketing_version, '-')
    uses: ./.github/workflows/mirror-release.yml
    with:
      tag: v${{ needs.version.outputs.marketing_version }}
      channel: stable
    secrets:
      R2_DOWNLOAD_ACCOUNT_ID: ${{ secrets.R2_DOWNLOAD_ACCOUNT_ID }}
      R2_DOWNLOAD_ACCESS_KEY_ID: ${{ secrets.R2_DOWNLOAD_ACCESS_KEY_ID }}
      R2_DOWNLOAD_SECRET_ACCESS_KEY: ${{ secrets.R2_DOWNLOAD_SECRET_ACCESS_KEY }}

  # The website's preview downloads follow the newest published release, a release candidate or
  # the stable release once it catches up, so they move after every publish: after the stable
  # mirror for a stable release (skipped for a prerelease), which its versioned DMGs then reuse.
  mirror-preview:
    name: Mirror the preview downloads
    needs: [version, release, mirror]
    if: >-
      always() && !cancelled() && needs.version.outputs.publish == 'true' &&
      needs.release.result == 'success' &&
      (needs.mirror.result == 'success' || needs.mirror.result == 'skipped')
    uses: ./.github/workflows/mirror-release.yml
    with:
      tag: latest
      channel: rc
    secrets:
      R2_DOWNLOAD_ACCOUNT_ID: ${{ secrets.R2_DOWNLOAD_ACCOUNT_ID }}
      R2_DOWNLOAD_ACCESS_KEY_ID: ${{ secrets.R2_DOWNLOAD_ACCESS_KEY_ID }}
      R2_DOWNLOAD_SECRET_ACCESS_KEY: ${{ secrets.R2_DOWNLOAD_SECRET_ACCESS_KEY }}
