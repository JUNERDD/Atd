name: Release

# Bumping `version` in apps/desktop/package.json on main publishes a GitHub Release
# `v<version>` with one dmg per Mac architecture. A signed build also publishes the update feed
# electron-updater reads (apps/desktop/electron/updater.ts): one zip and zip blockmap per
# architecture and a single latest-mac.yml (beta-mac.yml and so on for prereleases) listing both.
# A push that leaves the version as it was builds nothing, even when that version has no release
# yet. A manual run releases the current version unless its tag exists: use it for a first
# release without a bump, or to retry a release whose build failed.
on:
  push:
    branches: [main]
    paths: [apps/desktop/package.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Detect version bump
    # A manual run from another branch must not tag and publish unreviewed code.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The version before the push is read from `github.event.before`.
          fetch-depth: 0
      - id: version
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::apps/desktop/package.json version '$version' is not semver."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A push releases only a version bump; other edits to package.json (dependencies,
          # scripts) do not. An unreadable previous manifest falls through to the tag check.
          if [ "$EVENT" = push ]; then
            previous=$(git show "$BEFORE:apps/desktop/package.json" 2> /dev/null \
              | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version" 2> /dev/null \
              || true)
            if [ "$previous" = "$version" ]; then
              echo "The push kept version $version; nothing to release." >> "$GITHUB_STEP_SUMMARY"
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          # --exit-code returns 2 only when the tag is absent; any other failure stops the run.
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null || status=$?
          case $status in
            0)
              echo "v$version is already released; nothing to build." >> "$GITHUB_STEP_SUMMARY"
              echo "release=false" >> "$GITHUB_OUTPUT"
              ;;
            2) echo "release=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac

  build:
    name: macOS ${{ matrix.arch }} installer
    needs: version
    if: needs.version.outputs.release == 'true'
    strategy:
      matrix:
        # Native modules (selection-hook, the service's node_modules) are installed for the
        # host, so each architecture builds on its own runner instead of cross-packaging.
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      # Squirrel.Mac only installs updates signed by the running app's Developer ID team, so only
      # a signed build publishes update files; ad-hoc apps also turn their updater off at runtime.
      SIGNED: ${{ secrets.MAC_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Package dmg and zip
        env:
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # electron-builder treats an empty CSC_LINK as a certificate, so it is exported only
        # when the secret exists. Without one, the app is ad-hoc signed: an unsigned Apple
        # Silicon download is reported as damaged, while an ad-hoc one can be opened from
        # Privacy & Security. Hardened runtime is only needed for notarization and would
        # reject ad-hoc signed frameworks through library validation.
        run: |
          if [ -n "$MAC_CERTIFICATE" ]; then
            export CSC_LINK="$MAC_CERTIFICATE" CSC_KEY_PASSWORD="$MAC_CERTIFICATE_PASSWORD"
            pnpm --filter @ai/desktop package:installer
          else
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            echo "::warning::MAC_CERTIFICATE is not set; the dmg is ad-hoc signed and not notarized."
            pnpm --filter @ai/desktop package:installer -c.mac.identity=- -c.mac.hardenedRuntime=false
          fi
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dmg-${{ matrix.arch }}
          path: apps/desktop/release/*.dmg
          if-no-files-found: error
          retention-days: 7
      # Every architecture writes its own latest-mac.yml under the same name, so each one travels
      # in its own artifact and the release job merges them.
      - uses: actions/upload-artifact@v7.0.1
        if: env.SIGNED == 'true'
        with:
          name: update-${{ matrix.arch }}
          path: |
            apps/desktop/release/*.zip
            apps/desktop/release/*.zip.blockmap
            apps/desktop/release/*-mac.yml
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish v${{ needs.version.outputs.version }}
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SIGNED: ${{ secrets.MAC_CERTIFICATE != '' }}
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: dmg-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8.0.1
        if: env.SIGNED == 'true'
        with:
          pattern: update-*
          path: update
      # electron-updater reads one channel file per release and picks the zip for its own
      # architecture from `files` (MacUpdater.filterFilesForArch). Like electron-builder's own
      # multi-arch build, the merge concatenates `files` (each lists its zip and dmg) and keeps
      # the x64 zip in the legacy top-level `path`. yq ships on GitHub's Ubuntu runners.
      - name: Merge update feeds
        if: env.SIGNED == 'true'
        run: |
          mv update/*/*.zip update/*/*.zip.blockmap dist/
          for feed in update/update-arm64/*-mac.yml; do
            name=$(basename "$feed")
            yq eval-all '. as $feed ireduce ({}; . *+ $feed)' "$feed" "update/update-x64/$name" \
              > "dist/$name"
            if [ "$(yq '[.files[] | select(.url == "*.zip")] | length' "dist/$name")" != 2 ]; then
              echo "::error::$name does not list one zip per architecture."
              exit 1
            fi
          done
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        # Creates the tag at the commit that was built. A prerelease version (1.2.0-beta.1)
        # is published as a prerelease so it never becomes the latest release.
        run: |
          flags=()
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
          # Every file in dist: the dmgs, plus the update feed when the build is signed.
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes \
            "${flags[@]}"
