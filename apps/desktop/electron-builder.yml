appId: com.junerdd.ai
productName: AI
asar: true
directories:
  output: release
# T7 bundling map (`package` builds the dir target; `package:installer` builds
# the platform target below, which .github/workflows/release.yml publishes):
# extraResources = service dist + package.json (engines) + production
# node_modules from `pnpm deploy --prod --legacy` staging
# (tmp/t7-agent-service-pack; gitignored). node_modules is copied from the
# staging folder itself so package.json files:["dist"] cannot drop it.
# contracts/client dist remain for launcher/desktop resolution. The CLI runs on
# the official Node.js executable staged by scripts/prepare-service-pack.mjs
# (tmp/t7-node, pinned by the root .node-version and verified against the
# release SHASUMS256.txt), never a user-installed Node; unpackaged dev runs use
# the system Node. The osx-sign walk signs it with the rest of Contents/, with
# the app's hardened-runtime setting and the default entitlements (JIT
# included). Login-start = future.
# Stale Electron worker outputs are excluded here and deleted by
# scripts/prepare-service-pack.mjs before pack.
files:
  # T6 pure client: desktop ships main + preload only. The renderer ships once, as the `web`
  # extra resource below (the `dist-native` build), which the window loads.
  - dist-electron/**
  - '!dist-electron/worker*.js'
  - package.json
extraResources:
  # The renderer (`build:native`): loaded by the packaged window.
  - from: dist-native
    to: web
  # Menu bar status item template images (`electron/menu-bar.ts`).
  - from: resources/menu-bar
    to: menu-bar
    filter:
      - '*.png'
  - from: ../agent-service/dist
    to: agent-service/dist
    # The incremental build-info file only exists to keep the dev watcher from
    # re-emitting the whole service on every start; it is dead weight in the
    # packaged app.
    filter:
      - '**/*'
      - '!.tsbuildinfo'
  - from: ../agent-service/package.json
    to: agent-service/package.json
  - from: ../../tmp/t7-agent-service-pack/node_modules
    to: agent-service/node_modules
  - from: ../../packages/agent-contracts/dist
    to: agent-contracts/dist
  - from: ../../packages/agent-client/dist
    to: agent-client/dist
  # The bundled Node: `node/bin/node` on macOS and Linux, `node/node.exe` on Windows
  # (`electron/service/node-runtime.ts`). The service runs it by absolute path; on the service's
  # PATH its directory comes last, after the user's login-shell PATH (`serve --login-shell-path`).
  - from: ../../tmp/t7-node
    to: node
  # Identifies this packaged service build; a fresh id is written on every pack.
  - from: ../../tmp/t7-agent-service-pack/build-info.json
    to: agent-service/build-info.json
# Only runAsNode is changed; every other fuse keeps Electron's default. The service runs on
# the bundled Node, and nothing re-executes the Electron binary as Node.
electronFuses:
  runAsNode: false
  # Flipping a fuse rewrites the Electron binary; macOS on Apple Silicon kills a binary whose
  # signature no longer matches, so re-sign ad hoc for unsigned local packs. Real signing
  # (CI identity or `-c.mac.identity=-`) signs again afterwards.
  resetAdHocDarwinSignature: true
# The update feed electron-updater reads (`electron/updater.ts`). The scripts pass
# `--publish never` and .github/workflows/release.yml uploads the files, so this only writes
# Contents/Resources/app-update.yml, for the dmg and zip targets (not `--dir` packs).
publish:
  provider: github
  owner: JUNERDD
  repo: ai
mac:
  category: public.app-category.productivity
  # The dmg is the download; Squirrel.Mac installs updates from the zip.
  target: [dmg, zip]
  # The zip keeps the arch for x64 too, so each architecture's file is unambiguous in the merged
  # latest-mac.yml. The dmg sets its own name below.
  artifactName: ${productName}-${version}-${arch}-mac.${ext}
  # Shown the first time the service opens one of these folders: when the file index walks home
  # on the first file search (`crates/file-index`, run by the service's index worker), or when a
  # file there is attached. The index keeps file names only and never reads file contents.
  extendInfo:
    NSDesktopFolderUsageDescription: AI lists file names in your Desktop folder for file search, and reads a file only when you attach it.
    NSDocumentsFolderUsageDescription: AI lists file names in your Documents folder for file search, and reads a file only when you attach it.
    NSDownloadsFolderUsageDescription: AI lists file names in your Downloads folder for file search, and reads a file only when you attach it.
    # Start as an agent app so a hidden Dock icon never flashes at launch; `dock-visibility.ts`
    # shows the icon at runtime when the user turns on Show in Dock.
    LSUIElement: true
dmg:
  # Name both architectures explicitly; the default omits the arch for x64.
  artifactName: ${productName}-${version}-${arch}.${ext}
win:
  target: nsis
linux:
  category: Utility
  target: AppImage
