# XcodeGen source of truth for the thin App target. The generated AI.xcodeproj and
# App/Info.plist are not checked in; `pnpm --dir apps/macos run build` regenerates them.
# All logic lives in the AIMac Swift package next to this file.
name: AI
options:
  developmentLanguage: en
  deploymentTarget:
    macOS: '26.0'
  createIntermediateGroups: true
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: '26.0'
    ARCHS: arm64
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: 0.3.0
    CURRENT_PROJECT_VERSION: '1'
    # Ad hoc signing until Developer ID signing and notarization land with packaging.
    CODE_SIGN_IDENTITY: '-'
    CODE_SIGN_STYLE: Manual
    ENABLE_USER_SCRIPT_SANDBOXING: true
    DEAD_CODE_STRIPPING: true
packages:
  AIMac:
    path: .
targets:
  AI:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Info.plist
    dependencies:
      - package: AIMac
        product: AIShell
    settings:
      base:
        PRODUCT_NAME: AI
        GENERATE_INFOPLIST_FILE: false
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.junerdd.ai.dev
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.junerdd.ai
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: AI
        CFBundleDevelopmentRegion: en
        # The String Catalog's languages; the shell picks one at runtime (ShellStrings).
        CFBundleLocalizations: [en, zh-Hans]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSPrincipalClass: NSApplication
        # Start as an agent app so a hidden Dock icon never flashes at launch; the Show in Dock
        # setting changes the activation policy at runtime.
        LSUIElement: true
        # Shown the first time an attached file sits in one of these folders (copied from
        # apps/desktop/electron-builder.yml).
        NSDesktopFolderUsageDescription: AI reads a file in your Desktop folder only when you attach it.
        NSDocumentsFolderUsageDescription: AI reads a file in your Documents folder only when you attach it.
        NSDownloadsFolderUsageDescription: AI reads a file in your Downloads folder only when you attach it.
schemes:
  AI:
    build:
      targets:
        AI: all
    run:
      config: Debug
    archive:
      config: Release
