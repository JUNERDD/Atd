# XcodeGen source of truth for the thin App target. The generated AI.xcodeproj and
# App/Info.plist are not checked in; `pnpm --dir apps/macos run build` regenerates them.
# All logic lives in the AIMac Swift package next to this file.
name: AI
options:
  developmentLanguage: en
  deploymentTarget:
    macOS: '15.0'
  createIntermediateGroups: true
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: '15.0'
    # No ARCHS here: scripts/build.mjs passes the host's native architecture to xcodebuild, which
    # also covers the AIMac package targets and the driver helper (their Release builds otherwise
    # include both slices).
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: 0.10.3
    # Sparkle compares CFBundleVersion with an update's `sparkle:version`, so the build number
    # follows the release version instead of staying constant.
    CURRENT_PROJECT_VERSION: $(MARKETING_VERSION)
    # Sparkle feeds (Info.plist SUFeedURL and AtdArm64FeedURL). Each architecture has its own feed,
    # because an appcast can restrict an item to arm64 but not to x86_64: scripts/build.mjs points
    # x64 builds at appcast-x64.xml. The arm64 feed is where AppUpdater moves an x64 build running
    # under Rosetta. Plain values: `$(VAR:default=…)` would cut a URL at its first colon.
    ATD_SPARKLE_FEED_URL: https://downloads.atd.best/appcast.xml
    ATD_SPARKLE_ARM64_FEED_URL: https://downloads.atd.best/appcast.xml
    # Ad hoc signing unless `AI_CODE_SIGN_IDENTITY` names an identity, until Developer ID signing
    # and notarization land. Privacy grants (Screen Recording, Accessibility) follow an ad hoc
    # build's cdhash, so every rebuild loses them; a build signed by a certificate keeps them
    # across rebuilds signed by the same one. A local build may use e.g. `Apple Development`, with
    # its team in `AI_DEVELOPMENT_TEAM`, which Xcode requires for Apple-issued identities;
    # release.yml signs releases with the self-signed release certificate and sets no team.
    CODE_SIGN_IDENTITY: '$(AI_CODE_SIGN_IDENTITY:default=-)'
    DEVELOPMENT_TEAM: '$(AI_DEVELOPMENT_TEAM)'
    CODE_SIGN_STYLE: Manual
    ENABLE_USER_SCRIPT_SANDBOXING: true
    DEAD_CODE_STRIPPING: true
  # The shell's bundle id and widget URL scheme, which the App target and the widget extension
  # share: the extension's bundle id, the directory it may read and the links it opens derive
  # from them. AI_SERVICE_MENU_TITLE is the Finder entry's title, the Services entry's
  # (NSServices) and the Finder Sync extension's alike. Debug and Release differ, so both builds
  # can be installed side by side.
  configs:
    Debug:
      AI_HOST_BUNDLE_ID: com.junerdd.ai.dev
      AI_URL_SCHEME: atd-dev
      AI_SERVICE_MENU_TITLE: Add to Atd Dev
    Release:
      AI_HOST_BUNDLE_ID: com.junerdd.ai
      AI_URL_SCHEME: atd
      AI_SERVICE_MENU_TITLE: Add to Atd
packages:
  AIMac:
    path: .
targets:
  AI:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Info.plist
    dependencies:
      - package: AIMac
        product: AIShell
      - package: AIMac
        product: AIWidgetModel
      # The extensions are signed with the app's identity (ad hoc by default) and embedded in
      # Contents/PlugIns, plus ATD_EXTENSIONS_EMBED_SUBPATH: nothing in Release, `DevStaging` in
      # Debug, where macOS does not look for extensions. xcodebuild registers every app it builds
      # with LaunchServices; a DerivedData build whose extension macOS could find makes chronod
      # (or Finder) launch the extension from under ~/Documents, where a sandboxed extension
      # cannot run, and keep launching it from there after dev-install.mjs unregisters that
      # build. dev-install.mjs moves them into Contents/PlugIns of the installed copy only.
      - target: AtdWidgets
        embed: true
        codeSign: true
        copy:
          destination: plugins
          subpath: $(ATD_EXTENSIONS_EMBED_SUBPATH)
      - target: AtdFinderSync
        embed: true
        codeSign: true
        copy:
          destination: plugins
          subpath: $(ATD_EXTENSIONS_EMBED_SUBPATH)
      # The background computer-use driver (the `atd-computer-driver` target below), signed with
      # the app's identity and copied next to the main executable in Debug and Release alike. The
      # shell spawns it from Contents/MacOS as a direct child. Never linked into the app: it is a
      # separate process, so a crash or hang in its private-symbol calls stays out of the shell.
      - target: atd-computer-driver
        embed: true
        codeSign: true
        link: false
        copy:
          destination: executables
    # Release only: embeds the renderer (`apps/desktop/dist-native`) and the service pack with its
    # bundled Node (`scripts/prepare-service-pack.mjs`) where ServiceLaunchPlan, RendererSource and
    # EngineBinaries expect them. The computer-use engines that ship as add-ons are installed by
    # the service into its data directory, not part of the bundle; the background driver is the
    # embedded target above. `pnpm --filter @atd/macos build:release` prepares all of them first;
    # Debug builds skip it, use `pnpm dev`'s dev server and service, and run the checkout's staged
    # Node (`pnpm --filter @atd/macos addons:pack`).
    postBuildScripts:
      - name: Embed renderer and service
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          [ "$CONFIGURATION" = Release ] || exit 0
          repo="$SRCROOT/../.."
          renderer="$repo/apps/desktop/dist-native"
          service="$repo/tmp/t7-agent-service-pack"
          node="$repo/tmp/t7-node"
          for required in "$renderer/index.html" "$service/dist/cli.js" "$service/build-info.json" "$node/bin/node"; do
            if [ ! -e "$required" ]; then
              echo "error: $required is missing. Run pnpm --filter @atd/macos bundle first."
              exit 1
            fi
          done
          resources="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          rsync -a --delete "$renderer/" "$resources/renderer/"
          rsync -a --delete --exclude .tsbuildinfo "$service/" "$resources/agent-service/"
          rsync -a --delete "$node/" "$resources/node/"
    settings:
      base:
        PRODUCT_NAME: Atd
        PRODUCT_BUNDLE_IDENTIFIER: $(AI_HOST_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        # The embed phase copies whole directory trees from outside the project, which the
        # script sandbox only allows for individually declared files.
        ENABLE_USER_SCRIPT_SANDBOXING: false
      configs:
        Debug:
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDev
          ATD_EXTENSIONS_EMBED_SUBPATH: DevStaging
        Release:
          ATD_EXTENSIONS_EMBED_SUBPATH: ''
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Atd
        CFBundleDevelopmentRegion: en
        # The String Catalog's languages; the shell picks one at runtime (ShellStrings).
        CFBundleLocalizations: [en, zh-Hans]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        # Widget taps (`<scheme>://apps/<appId>?route=<route>`, WidgetLink) and the Finder Sync
        # extension's `<scheme>://finder` (FinderHandoff), checked by the shell before it opens
        # anything.
        CFBundleURLTypes:
          - CFBundleURLName: $(AI_HOST_BUNDLE_ID).widget-link
            CFBundleURLSchemes: [$(AI_URL_SCHEME)]
        # Read by the shared code (WidgetFiles, WidgetLink, FinderHandoff) in the app and the
        # extensions.
        AtdHostBundleIdentifier: $(AI_HOST_BUNDLE_ID)
        AtdURLScheme: $(AI_URL_SCHEME)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSPrincipalClass: NSApplication
        # Sparkle (AppUpdater, Release builds only): the R2 mirror's appcast for this build's
        # architecture (ATD_SPARKLE_FEED_URL above), which points at the mirrored dmg
        # (ops/release-downloads); release.yml signs that dmg with the private half of this key.
        # Checks run hourly (Sparkle's minimum; releases often ship several a day) without asking
        # first, and an update downloads in the background with its progress in the panel, then
        # installs on quit or from the panel (UpdateUserDriver). Sparkle's own silent automatic
        # downloads stay off: they report no progress, and the update alert hides its opt-in.
        SUFeedURL: $(ATD_SPARKLE_FEED_URL)
        AtdArm64FeedURL: $(ATD_SPARKLE_ARM64_FEED_URL)
        SUScheduledCheckInterval: 3600
        SUPublicEDKey: ZkMCOa3sWdgMqszOe6hWN78I1eh77SzbSaghs2iy6lU=
        SUEnableAutomaticChecks: true
        SUAllowsAutomaticUpdates: false
        # Start as an agent app so a hidden Dock icon never flashes at launch; the Show in Dock
        # setting changes the activation policy at runtime.
        LSUIElement: true
        # Notifications start as alerts rather than banners, so a question's answers and Reply
        # stay on screen until the person acts on them (ShellNotifier); the person can still pick
        # banners in System Settings › Notifications.
        NSUserNotificationAlertStyle: alert
        # Shown the first time an attached file sits in one of these folders.
        NSDesktopFolderUsageDescription: Atd reads a file in your Desktop folder only when you attach it.
        NSDocumentsFolderUsageDescription: Atd reads a file in your Documents folder only when you attach it.
        NSDownloadsFolderUsageDescription: Atd reads a file in your Downloads folder only when you attach it.
        # The Services entry (FinderService): selected files and folders go to the panel's
        # composer. macOS lists it under Services, in Finder and in other apps; the empty
        # NSRequiredContext enables it by default. ServicesMenu.xcstrings localizes the title
        # (keyed by the English one). Development builds may need
        # `/System/Library/CoreServices/pbs -update` before Finder lists it. The same entry at the
        # top of Finder's context menu is the AtdFinderSync extension below.
        NSServices:
          - NSMenuItem:
              default: $(AI_SERVICE_MENU_TITLE)
            NSMessage: addToAtd
            NSPortName: $(PRODUCT_NAME)
            NSRequiredContext: {}
            NSSendFileTypes: [public.item]
        # Lets files and folders be dropped on the Dock icon and opened with `open -a`
        # (application(_:open:)) without making Atd their default app.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Files and folders
            CFBundleTypeRole: Viewer
            LSHandlerRank: None
            LSItemContentTypes: [public.item, public.folder]
  # The desktop widgets (plan Q4, T1b, T1c): two fixed kinds, App Widget (an instance shows one
  # user app's widget) and My Apps (a launcher of the user's apps), both rendered from the files
  # the shell writes (WidgetSync, WidgetFiles). App Widget's App Intents
  # (the configuration) must exist in this bundle only: a copy in the App target makes the
  # system resolve the intent to the host module, which the extension cannot instantiate.
  AtdWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: Widgets
        excludes:
          - Extension/Info.plist
          - Extension/AtdWidgets.entitlements
    dependencies:
      - package: AIMac
        product: AIWidgetRender
      - sdk: AppIntents.framework
    settings:
      base:
        PRODUCT_NAME: AtdWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(AI_HOST_BUNDLE_ID).widgets
        # One binary in Debug too. With the debug dylib split, the stub executable links only the
        # dylib, and the App Intents metadata processor reads the stub's linker dependency info,
        # finds no AppIntents.framework, and skips extraction ("No AppIntents.framework dependency
        # found"), so the extension ships without its widget configuration and every widget stays
        # a placeholder (v11 acceptance). The split only speeds up SwiftUI previews.
        ENABLE_DEBUG_DYLIB: NO
        GENERATE_INFOPLIST_FILE: false
        SKIP_INSTALL: YES
        # Ad hoc builds would otherwise gain get-task-allow; the extension's entitlements are
        # exactly the two below.
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    # WidgetKit requires the sandbox. The one exception is read-only access to the directory the
    # shell writes (T1b: works ad hoc and team signed, without a prompt and without a
    # provisioning profile; App Groups do not, ad hoc). Paths are relative to the user's home.
    entitlements:
      path: Widgets/Extension/AtdWidgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - /Library/Application Support/$(AI_HOST_BUNDLE_ID)/widgets/
    info:
      path: Widgets/Extension/Info.plist
      properties:
        CFBundleDisplayName: Atd
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hans]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AtdHostBundleIdentifier: $(AI_HOST_BUNDLE_ID)
        AtdURLScheme: $(AI_URL_SCHEME)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  # The Finder entry at the top of the context menu (FinderSyncExtension), which the Services
  # entry cannot reach. Its title comes from the Services entry's String Catalog, shared here; it
  # hands the selected items to the app through FinderHandoff (AIWidgetModel).
  AtdFinderSync:
    type: app-extension
    platform: macOS
    sources:
      - path: FinderSync
        excludes:
          - Info.plist
          - AtdFinderSync.entitlements
      - path: App/ServicesMenu.xcstrings
    dependencies:
      - package: AIMac
        product: AIWidgetModel
      - sdk: FinderSync.framework
    settings:
      base:
        PRODUCT_NAME: AtdFinderSync
        PRODUCT_BUNDLE_IDENTIFIER: $(AI_HOST_BUNDLE_ID).finder-sync
        # One binary in Debug too, so dev-install.mjs signs a single file when it moves the
        # extension into place.
        ENABLE_DEBUG_DYLIB: NO
        GENERATE_INFOPLIST_FILE: false
        SKIP_INSTALL: YES
        # Ad hoc builds would otherwise gain get-task-allow; the sandbox is the only entitlement.
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    # Finder Sync requires the sandbox. The extension never reads the selected items: it passes
    # their URLs to the app on a pasteboard, and the app reads them.
    entitlements:
      path: FinderSync/AtdFinderSync.entitlements
      properties:
        com.apple.security.app-sandbox: true
    info:
      path: FinderSync/Info.plist
      properties:
        CFBundleDisplayName: Atd
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hans]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AtdHostBundleIdentifier: $(AI_HOST_BUNDLE_ID)
        AtdURLScheme: $(AI_URL_SCHEME)
        AtdServiceMenuTitle: $(AI_SERVICE_MENU_TITLE)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.FinderSync
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FinderSyncExtension
  # The background computer-use driver helper (Sources/AIComputerDriver*): the package's
  # `atd-computer-driver` executable built as a command-line tool, so the App target can embed it
  # at Contents/MacOS/atd-computer-driver. Only the entry point (Sources/AtdComputerDriverCLI,
  # shared with the SwiftPM executable target and so inside its lint and format scope) is
  # compiled here; the driver itself is the AIComputerDriver library product. The shell spawns
  # the helper directly, not through LaunchServices, which is how it inherits Atd's Accessibility
  # and PostEvent grants. It takes the build settings above, so it is built for the same
  # architecture, deployment target and signing identity as the app (scripts/verify-app.mjs
  # checks the embedded binary: architecture, signature, minimum macOS, and a start).
  atd-computer-driver:
    type: tool
    platform: macOS
    sources:
      - path: Sources/AtdComputerDriverCLI
    dependencies:
      - package: AIMac
        product: AIComputerDriver
    settings:
      base:
        PRODUCT_NAME: atd-computer-driver
        # One binary in Debug too, without the `.debug.dylib` stub: the shell spawns this file
        # itself, and a stub would leave the driver's code in a second file to find and sign.
        ENABLE_DEBUG_DYLIB: NO
        # Built only to be embedded in the app, never installed.
        SKIP_INSTALL: YES
        # Without this, Xcode signs a tool with an empty `com.apple.application-identifier`
        # entitlement (the app and its extension get none), an identifier that belongs to
        # provisioning profiles, which an ad hoc or self-signed build does not have. The helper
        # needs no entitlements; an ad hoc build still gets the base get-task-allow, like the app.
        ENTITLEMENTS_REQUIRED: NO
schemes:
  AI:
    build:
      targets:
        AI: all
    run:
      config: Debug
    archive:
      config: Release
