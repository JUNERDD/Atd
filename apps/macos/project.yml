# XcodeGen source of truth for the thin App target. The generated AI.xcodeproj and
# App/Info.plist are not checked in; `pnpm --dir apps/macos run build` regenerates them.
# All logic lives in the AIMac Swift package next to this file.
name: AI
options:
  developmentLanguage: en
  deploymentTarget:
    macOS: '26.0'
  createIntermediateGroups: true
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: '26.0'
    # Covers this project's targets only: Release builds of the AIMac package targets default to
    # arm64 and x86_64, so `build:release` also passes ARCHS=arm64 to xcodebuild.
    ARCHS: arm64
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: 0.4.0
    CURRENT_PROJECT_VERSION: '1'
    # Ad hoc signing until Developer ID signing and notarization land with packaging. Privacy
    # grants (Screen Recording, Accessibility) follow an ad hoc build's cdhash, so every rebuild
    # loses them; a local build signed by a trusted identity keeps them. `AI_CODE_SIGN_IDENTITY`
    # names it (e.g. `Apple Development`) and `AI_DEVELOPMENT_TEAM` its team, which Xcode requires
    # for Apple-issued identities. CI sets neither.
    CODE_SIGN_IDENTITY: '$(AI_CODE_SIGN_IDENTITY:default=-)'
    DEVELOPMENT_TEAM: '$(AI_DEVELOPMENT_TEAM)'
    CODE_SIGN_STYLE: Manual
    ENABLE_USER_SCRIPT_SANDBOXING: true
    DEAD_CODE_STRIPPING: true
packages:
  AIMac:
    path: .
targets:
  AI:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Info.plist
    dependencies:
      - package: AIMac
        product: AIShell
    # Release only: embeds the renderer (`apps/desktop/dist-native`) and the service pack with its
    # bundled Node (`scripts/prepare-service-pack.mjs`) where ServiceLaunchPlan and
    # RendererSource expect them. `pnpm --filter @atd/macos build:release` prepares both first;
    # Debug builds skip it and use `pnpm dev`'s dev server and service.
    postBuildScripts:
      - name: Embed renderer and service
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          [ "$CONFIGURATION" = Release ] || exit 0
          repo="$SRCROOT/../.."
          renderer="$repo/apps/desktop/dist-native"
          service="$repo/tmp/t7-agent-service-pack"
          node="$repo/tmp/t7-node"
          for required in "$renderer/index.html" "$service/dist/cli.js" "$service/build-info.json" "$node/bin/node"; do
            if [ ! -e "$required" ]; then
              echo "error: $required is missing. Run pnpm --filter @atd/macos bundle first."
              exit 1
            fi
          done
          resources="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          rsync -a --delete "$renderer/" "$resources/renderer/"
          rsync -a --delete --exclude .tsbuildinfo "$service/" "$resources/agent-service/"
          rsync -a --delete "$node/" "$resources/node/"
    settings:
      base:
        PRODUCT_NAME: AI
        GENERATE_INFOPLIST_FILE: false
        # The embed phase copies whole directory trees from outside the project, which the
        # script sandbox only allows for individually declared files.
        ENABLE_USER_SCRIPT_SANDBOXING: false
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.junerdd.ai.dev
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.junerdd.ai
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: AI
        CFBundleDevelopmentRegion: en
        # The String Catalog's languages; the shell picks one at runtime (ShellStrings).
        CFBundleLocalizations: [en, zh-Hans]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSPrincipalClass: NSApplication
        # Start as an agent app so a hidden Dock icon never flashes at launch; the Show in Dock
        # setting changes the activation policy at runtime.
        LSUIElement: true
        # Shown the first time an attached file sits in one of these folders.
        NSDesktopFolderUsageDescription: AI reads a file in your Desktop folder only when you attach it.
        NSDocumentsFolderUsageDescription: AI reads a file in your Documents folder only when you attach it.
        NSDownloadsFolderUsageDescription: AI reads a file in your Downloads folder only when you attach it.
schemes:
  AI:
    build:
      targets:
        AI: all
    run:
      config: Debug
    archive:
      config: Release
