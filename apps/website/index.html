<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--app-head-->
    <script>
      // Sends visitors whose browser prefers Chinese to the Chinese page until they pick a language
      // themselves: the language links record that choice under `atd-lang`.
      try {
        if (
          location.pathname === '/' &&
          !localStorage.getItem('atd-lang') &&
          /^zh\b/i.test(navigator.language)
        )
          location.replace('/zh' + location.hash);
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
