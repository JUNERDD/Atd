<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <script>
      (() => {
        try {
          const t = localStorage.getItem('atd-theme');
          if (t !== 'light' && t !== 'dark') return;
          document.documentElement.dataset.theme = t;
          const cs = document.querySelector('meta[name="color-scheme"]');
          if (cs) cs.setAttribute('content', t);
          const color = t === 'light' ? '#ffffff' : '#000000';
          document
            .querySelectorAll('meta[name="theme-color"]')
            .forEach((m) => m.setAttribute('content', color));
        } catch {}
      })();
    </script>
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--app-head-->
    <script>
      // Entrance motion: content is held back for its reveal only when scripts run and the visitor
      // allows motion; set before first paint so nothing shows and then hides (styles/motion.css).
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches)
        document.documentElement.setAttribute('data-motion', '');
    </script>
    <script>
      // Sends visitors whose browser prefers Chinese to the Chinese page until they pick a language
      // themselves: the language links record that choice under `atd-lang`.
      try {
        if (
          !navigator.webdriver &&
          location.pathname === '/' &&
          !localStorage.getItem('atd-lang') &&
          /^zh\b/i.test(navigator.language)
        )
          location.replace('/zh' + location.hash);
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
