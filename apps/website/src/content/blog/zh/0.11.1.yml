version: '0.11.1'
date: '2026-11-14'
title: 证书更新后直达恢复模型凭据，并优化浅色模式通透质感
summary: 当系统钥匙串访问受阻时可直接跳转恢复模型密钥与登录并保留原有配置，浅色模式下的玻璃、卡片与控件层次更柔和协调，正式版与自动更新现已完整通过 Apple 公证。
highlights:
  - title: 证书更新后，直接恢复模型连接凭据
    body: |-
      当 macOS 钥匙串因签名证书切换或权限变化暂时无法读取已保存的 API 密钥或 OAuth 登录时，Atd 会主动识别受影响的连接，并在重新授权弹窗中与**辅助功能**、**屏幕录制**一并列出**模型密钥与登录**一项。

      - **点击直达设置 › 模型** —— 点按该行右侧的**去设置**（或系统权限恢复后的**前往模型设置**），即可在模型页面看到带行内恢复提示的对应连接。
      - **完整保留既有配置** —— 直接重新输入密钥或完成登录授权即可恢复，无需重新填写端点地址、自定义模型列表或默认模型选择。
    image: /media/blog/0.11.1/credential-recovery.zh.webp
    alt: 暮色雪山背景上的深色 Atd 任务面板，居中展示“签名证书已更新，需重新授权”弹窗，下方依次列出“辅助功能”、“屏幕录制”以及第三项“模型密钥与登录（去设置）”，右侧白色手绘箭头指向第三项。
  - title: 更通透协调的浅色模式界面
    body: |-
      浅色模式下的玻璃控件、设置卡片、对话详情块与表格改为基于当前面板背景的半透明材质与柔和描边，不再呈现生硬的纯白或发灰实色色块。

      同时调整了浅色模式下未开启开关轨道、滑块、进度条、描边按钮、弹窗关闭按钮与输入框边框的对比度，让各类控件在任意壁纸与面板底色上都清晰自然。
    image: /media/blog/0.11.1/light-mode-surfaces.zh.webp
    alt: 悬浮在暮色雪山背景上的浅色模式“设置 › 通用”窗口，展示半透明“外观”和“窗口与启动”卡片、浅色主题下拉框以及清晰可见的未开启开关轨道，右侧手绘箭头指向外观设置卡片。
fixes:
  - text: 修复了多提供商场景下可能连续弹出多次 macOS 钥匙串授权窗口的问题：改为串行队列读取并缓存已验证状态，检测到无法读取或网络异常时及时停止自动探测，并在重新保存密钥时妥善重建旧版钥匙串访问权限记录。
  - text: 修复了浅色模式下代码与产物卡片头、详情表格、服务状态横幅、弹窗关闭按钮及设置原生加载界面底色不透明或描边过重的问题。
  - text: 修复了在未先打开**命令**页的情况下直接进入**设置 › 记忆**时，筛选栏与编辑器样式未正确生效的问题。
other:
  - text: 正式版安装包与自动更新现已同时完成 **Apple Developer ID** 签名与 **Apple 公证**，新下载的安装包可直接打开运行，不再需要前往系统设置手动放行。
