version: '0.12.0'
date: '2026-11-19'
title: 模型别名、更丰富的截图标注与贴图置顶，以及内置系统诊断
summary: 将模型、上下文窗口与推理强度保存为可复用别名一键切换，截图标注新增丰富样式并支持跨空间贴图置顶，内置七层系统诊断与脱敏支持包导出，同时大幅加快应用启动与首帧响应。
highlights:
  - title: 可复用的模型别名，一键切换并全局同步
    body: |-
      在**设置 › 模型 › 模型别名**中，把模型提供商连接、具体模型、上下文窗口与推理强度打包为一个命名别名（或从预设起步），在对话、命令与自动化之间共用同一套配置：

      - **继承或固定默认配置** —— 未调整时自动沿用连接或模型的默认上下文与推理强度，也可以按别名固定并随时恢复继承；切换不同模型时会自动将推理强度校准到支持的档位。
      - **一处修改，处处同步** —— 编辑别名即可同步更新所有绑定该别名的命令与自动化，并可指定新建会话优先使用的默认模型别名。
      - **输入框随时切换** —— 通过输入框模型菜单、`/model` 斜杠指令或快捷键 `⇧⌘M`（可在**设置 › 快捷键**自定义）循环切换别名。单次对话中的临时微调不会改写已保存的别名默认配置，可随时一键**还原**或**另存为新别名**。
    image: /media/blog/0.12.0/model-aliases.zh.webp
    alt: 模型设置列出三个别名及各自的提供商、模型、上下文窗口和推理强度。右侧任务面板的输入框上方展开了同一组别名。
  - title: 更丰富的截图标注工具与跨空间贴图置顶
    body: |-
      在截图上用更精细的图形、文字与马赛克完成标注，并把任意截图钉在屏幕最上方随时对照：

      - **一键贴图置顶** —— 点击截图工具栏上的**贴图**，即可把当前选区变成无边框悬浮窗口并跨桌面空间置顶显示；支持缩放（`+`/`-`/`0`）、调节透明度（`⌘+`/`⌘-`/`⌘0`）、开关边框（`B`）与阴影（`S`）、复制（`⌘C`）以及关闭（`Esc` 或 `⌘W`）。
      - **更丰富的形状、箭头、文字与智能形状** —— 支持描边、柔和填充与实心填充、直角或可调圆角、虚线描边、锥形/经典/双向及弯曲箭头、四种文字底板（无底板、实色、磨砂、描边）、聚光灯形状与压暗强度、数字或字母步骤编号，以及框选或画笔涂抹马赛克。使用画笔停顿片刻即可自动规整为直线、曲线、矩形或椭圆，并支持多选标注、复制粘贴与调整图层先后。
      - **取色器、自定义色轮、字体与比例预设** —— 颜色选择器支持 Hex、透明度、最近颜色与屏幕取色（放大镜同步支持复制色值）；字体选择器覆盖精选、Google Fonts、本地与最近字体；点击选区尺寸角标可直接锁定 `1:1`、`4:3`、`16:9`、`9:16` 常见比例。
    image: /media/blog/0.12.0/screenshot-annotations-pin.zh.webp
    alt: 截图选区框住三个模型别名，红色虚线框和弯箭头标出“代码审查”的配置。右侧贴图保留相同标注，悬停控制栏位于贴图顶部。
  - title: 内置系统诊断、七层自检与自动脱敏支持包
    body: |-
      点击设置底栏**关于**右侧的**系统诊断**图标按钮——或在服务异常提示中点击**诊断**——即可直接排查权限、工具链与网络问题：

      - **七层系统自检（Doctor）** —— 依次检查应用安装位置与签名、macOS 权限与钥匙串、智能体服务与本地存储、登录 Shell `PATH` 与命令行工具（`git`、`uv`、`npx`、`rg`、Node.js）、系统代理/TLS/时钟对齐、原生扩展/MCP/文件与记忆索引，以及按需执行的外部连通性检测，并提供直达系统设置或重启服务的行内修复入口。
      - **10 秒交互式实时探针** —— 在 10 秒窗口内实测划词工具栏、全局快捷键与修饰键交接，或屏幕采集与仲裁锁状态，全程不记录任何选区原文、键入字符或屏幕像素。
      - **自动脱敏的诊断支持包** —— 导出 `.zip` 压缩包前可逐文件预览内容与脱敏计数；五通道隐私脱敏器会在保存前自动排除或擦除个人路径、API 密钥、访问令牌与对话内容。窗口或服务异常时，也会呈现原生毛玻璃恢复卡片以便直接重试或导出诊断包。
    image: /media/blog/0.12.0/diagnostics-doctor.zh.webp
    alt: 诊断设置中打开了支持包预览。左侧是归档文件列表，右侧是选中清单文件的内容，下方可保存压缩包，预览中同时显示脱敏次数。
improvements:
  - text: '**启动与首帧全面提速**：并行化智能体服务启动流程并将 MCP、模型运行时与解压工具等可选模块改为按需加载；主面板提前预热状态并将历史记录、应用、快捷面板、代码高亮与等待光晕拆包懒加载；面板与设置窗口引入原生 `WindowLoadingStage` 门控，避免首帧闪烁。'
  - text: '**确认截图行为可选**：在**设置 › 通用 › 截图**中可选择点击 `✓`、按回车或双击选区时，是添加到输入框并复制到剪贴板、仅添加到输入框，还是仅复制到剪贴板，并可单独控制是否对输入框内「`+` › 截图」生效。'
  - text: '**欢迎指南内联配置升级**：在首次引导中即可直接调整外观、划词工具栏图标模式以及截图快捷键与确认方式；模型步骤同步展示默认模型别名与凭据恢复状态，并更新了核心能力插画。'
  - text: '**滚动长截图体验升级**：长截图实时拼接期间通过不拦截鼠标事件的底幕透传滚轮事件，无需把指针移入选区即可自然滚动；自动滚动升级为 60fps 窗口定向连续像素滚动，并强化了全区域匹配、回弹抑制与大跨度跳跃桥接。'
  - text: '**列表循环键盘导航与静止指针门控**：菜单、列表、模型选择器、快捷面板、设置导航与灵动岛选项卡片现已支持方向键首尾循环切换，并在鼠标静止时屏蔽误触悬停，保持键盘焦点稳定。'
  - text: '**设置 › 记忆**的分组筛选改为标签页并在查看详情后保持当前分组；主面板的快捷指令区域改为有上限的可滚动区域，稳妥位于操作栏上方。'
fixes:
  - text: 修复了关闭辅助窗口或浮层时可能将键盘焦点错误提升到被遮挡的常驻面板上的问题，现在会准确交还给可见窗口或前台应用。
  - text: 修复了毛玻璃表面描边轮廓与内容弹性动画在尺寸变化或展开过程中不同步的问题。
  - text: 修复了截图文字命令在部分模型回显段落编号时漏段或解析异常的问题。
  - text: 修复了诊断检查详情、提供商高级端点等折叠区域在收起时残留空白间距或突然跳动的问题。
  - text: 修复了在支持不同推理强度档位的模型间切换别名时，推理强度继承与档位校准边界异常的问题。
  - text: 加固了系统诊断的日志脱敏、压缩包导出、未鉴权端点连通性探测、实时探针取消、代理检查去重，以及首次加载时的占位布局稳定性。
