version: '0.12.1'
date: '2026-11-23'
title: 附件被拒时说清原因，长截图支持更多应用
summary: 文件无法附加时直接看到原因，并一键打开对应的隐私设置；窗口加载时显示全新的 Atd 标志动画；在自绘界面的应用里也能截长截图。
highlights:
  - title: 看清文件为何没能附加
    body: |-
      拖入、粘贴、选取或通过访达服务添加的文件或文件夹无法加入时，提示会先用一行简短标题说明原因，再在下方单独列出项目名称。过长的名称会像访达一样从中间省略，带哈希值的文件名也能保留扩展名，不再在卡片里折成多行。

      - **一键修复访问权限** —— 当 macOS 隐私设置不允许 Atd 读取文件时，提示会提供**打开系统设置**按钮，直接前往**隐私与安全性 › 文件与文件夹**。
      - **分清不同原因** —— 文件不存在或尚未保存、Atd 没有读取权限、存储空间不足，各有专门的提示，不再一律显示“无法读取”。
      - **命令岛措辞一致** —— 命令岛的输入卡片会用相同的原因说明被拒的文件，并把名称单独放在一行。
    image: /media/blog/0.12.1/refused-attachments.zh.webp
    alt: 北极光背景上的 Atd 任务面板顶部显示一条提示：“没有读取此文件的权限”，下方是从中间省略的文件名 1ce5da53f2a94c0b8…faf484.jpg，右侧有“打开系统设置”按钮；白色手写批注和箭头指向该按钮。
improvements:
  - text: '**全新的加载动画**：任务面板和设置窗口加载或本地服务启动时，Atd 标志的两颗水滴会相互环绕、再合成完整标志，取代原来的普通转圈；从窗口的原生占位画面到页面本身都保持一致。开启“减弱动态效果”后，标志保持完整，仅轻微呼吸。'
  - text: '**更顺滑的循环动效**：占位脉冲、“滚动到最新”按钮的光晕、欢迎引导里的插图，以及运行中文字的流光，都改为连续缓动，不再停顿，也不再以恒定速度扫过。'
  - text: '**自动化的文件夹触发器**现在会说明所选文件夹找不到或 Atd 没有读取权限，而不是笼统地提示无法读取。'
fixes:
  - text: 修复了在微信、Warp 等自绘界面的应用里，以及其他应用的浮动窗口上，即使内容可以滚动也无法使用**长截图**的问题；当辅助功能无法判断区域是否可滚动时，现在也会提供长截图按钮。
  - text: 修复了选区覆盖空白或纯色内容时，页面在滚动但长截图不再变长的问题。Atd 现在会参照选区周围的滚动区域测量滚动距离，图片仍只保留你选中的范围。
  - text: 选区过小、无法拼接时不再提供**长截图**（以前会滚动页面却不延长图片），按钮提示会说明所需的最小尺寸。
  - text: 修复了通知中心等后台应用在最上层保留透明全屏窗口时，截图选区无法识别的问题。
other:
  - text: 内置的 Node.js 运行时更新至 24.22.3，并更新了内置智能体引擎；本地服务的 HTTP 客户端已升级到不受六项公开安全通告影响的版本。
