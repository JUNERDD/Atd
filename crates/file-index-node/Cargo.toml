[package]
name = "file-index-node"
version = "0.1.0"
description = "Node-API binding for the file-index crate"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
file-index = { path = "../file-index" }
# napi-derive expands to calls into napi's runtime, and Cargo cannot check that pairing (the macro
# crate does not depend on napi): raise both to releases from the same napi-rs publish.
napi = { version = "3.16.2", default-features = false, features = ["napi4"] }
napi-derive = "3.7.1"

[build-dependencies]
napi-build = "2.6.0"
