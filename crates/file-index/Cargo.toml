[package]
name = "file-index"
version = "0.1.0"
description = "Persistent file-name index of the attachable files under the home folder"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Exact pin: 0.x with frequent breaking releases, no public repository. Only `store.rs` may use it.
minidex = "=0.39.0"
ignore = "0.4.33"
libc = "0.2.190"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
unicode-normalization = "0.1.25"

[target.'cfg(target_os = "macos")'.dependencies]
# FSEvents through the objc2 bindings, with streams delivered on a dispatch queue. Features are
# listed exactly because these crates default to wrapping every framework API.
dispatch2 = { version = "0.3.1", default-features = false, features = ["std", "alloc"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "CFString",
  "CFArray",
  "CFUUID",
] }
objc2-core-services = { version = "0.3.2", default-features = false, features = [
  "std",
  "FSEvents",
  "libc",
  "dispatch2",
] }

[dev-dependencies]
tempfile = "3.27.0"
