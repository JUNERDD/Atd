[package]
name = "file-index"
version = "0.1.0"
description = "Persistent file-name index of the attachable files under the home folder"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Exact pin: 0.x with frequent breaking releases, no public repository. Only `store.rs` may use it.
minidex = "=0.36.0"
ignore = "0.4.33"
libc = "0.2.186"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.17"
unicode-normalization = "0.1.25"

[target.'cfg(target_os = "macos")'.dependencies]
# 4.1.0, not 5.x: 5.x is `#[deprecated]` at crate level; 4.1.0 is what notify 8.2 builds on.
fsevent-sys = "=4.1.0"

[dev-dependencies]
tempfile = "3.27.0"
