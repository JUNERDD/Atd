packages:
  - apps/*
  - packages/*

saveExact: true
engineStrict: true
minimumReleaseAgeExcludePrune: true
catalogPrune: true
catalogMode: prefer

catalog:
  typebox: 1.3.34
  react: 19.3.0
  react-dom: 19.3.0
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  lucide-react: 1.49.0
  motion: 13.4.6
  tailwindcss: 4.3.3
  vitest: 5.0.3
  oxc-transform-react: 0.145.0
  shiki: 4.4.3
  oxlint-tsgolint: 7.0.2003
  '@ziloen/remark-math': 0.1.2
  katex: 0.16.47
  mdast-util-math: 3.0.0
  rehype-katex: 7.0.1

allowBuilds:
  '@google/genai': false
  esbuild: true
  protobufjs: false

minimumReleaseAgeExclude:
  - '@earendil-works/chord@1.0.0'
  - '@earendil-works/pi-agent-core@1.0.0'
  - '@earendil-works/pi-ai@1.0.0'
  - '@earendil-works/pi-codemode@1.0.0'
  - '@earendil-works/pi-coding-agent@1.0.0'
  - '@earendil-works/pi-mcp@1.0.0'
  - '@earendil-works/pi-telemetry@1.0.0'
  - '@earendil-works/pi-tui@1.0.0'
  - pi-subagents@0.74.0
  - pi-web-access@0.35.0

patchedDependencies:
  '@earendil-works/pi-coding-agent@1.0.0': patches/@earendil-works__pi-coding-agent@1.0.0.patch
  pi-subagents@0.74.0: patches/pi-subagents@0.74.0.patch
