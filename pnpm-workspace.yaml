packages:
  - apps/*
  - packages/*

saveExact: true
engineStrict: true
minimumReleaseAgeExcludePrune: true
catalogPrune: true
catalogMode: prefer

catalog:
  typebox: 1.4.3
  react: 19.3.1
  react-dom: 19.3.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  lucide-react: 1.61.0
  motion: 14.0.0
  tailwindcss: 4.3.3
  vitest: 5.0.5
  oxc-transform-react: 0.152.0
  shiki: 4.5.0
  oxlint-tsgolint: 7.0.2005
  '@ziloen/remark-math': 0.1.2
  katex: 0.19.1
  mdast-util-math: 3.0.0
  rehype-katex: 7.0.1
  croner: 10.0.1
  radix-ui: 1.8.1
  openid-client: 6.8.8
  agent-base: 9.0.0
  http-proxy-agent: 9.1.0
  https-proxy-agent: 9.1.0
  undici: 8.12.3
  '@tanstack/react-hotkeys': 0.17.0

allowBuilds:
  '@google/genai': false
  esbuild: true
  protobufjs: false
  workerd: true

# @pierre/trees pins @pierre/theming 1.0.0, whose peer range predates the @pierre/theme 2.0.0 that
# @pierre/diffs installs; 1.0.1 only widens that range (same code). Drop once @pierre/trees moves past it.
overrides:
  '@pierre/trees>@pierre/theming': 1.0.1
  # rehype-katex still requests vulnerable 0.16.x; use the same renderer as the imported CSS.
  'rehype-katex>katex': 0.19.1
  # Mermaid 11's math labels also use the patched renderer; the plugin still targets Mermaid 11.
  'mermaid>katex': 0.19.1
  # These SDKs pin an affected Undici release; keep the service's patched 8.x transport.
  '@earendil-works/pi-coding-agent>undici': 8.12.3
  'pi-subagents>undici': 8.12.3
  # pi-web-access pins 1.32.1; align its client with the service's SDK patch release.
  'pi-web-access>@modelcontextprotocol/sdk': 1.32.2
  # Miniflare pins 7.29.1; stay on Undici 7 while taking its security fixes.
  'miniflare>undici': 7.30.1

patchedDependencies:
  # Keep malformed loopback callback URLs from crashing OpenRouter and Radius sign-in.
  '@earendil-works/pi-ai@1.4.0': patches/@earendil-works__pi-ai@1.4.0.patch
  # Preserve the app's summary output budgets; Pi 1.4 otherwise uses the model's full limit.
  '@earendil-works/pi-coding-agent@1.4.0': patches/@earendil-works__pi-coding-agent@1.4.0.patch
  pi-subagents@0.76.1: patches/pi-subagents@0.76.1.patch
