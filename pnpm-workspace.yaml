packages:
  - apps/*
  - packages/*

saveExact: true
engineStrict: true
minimumReleaseAgeExcludePrune: true
catalogPrune: true
catalogMode: prefer

catalog:
  typebox: 1.3.36
  react: 19.3.0
  react-dom: 19.3.0
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  lucide-react: 1.54.0
  motion: 14.0.0
  tailwindcss: 4.3.3
  vitest: 5.0.3
  oxc-transform-react: 0.152.0
  shiki: 4.5.0
  oxlint-tsgolint: 7.0.2003
  '@ziloen/remark-math': 0.1.2
  katex: 0.16.47
  mdast-util-math: 3.0.0
  rehype-katex: 7.0.1
  croner: 10.0.1
  radix-ui: 1.7.0

allowBuilds:
  '@google/genai': false
  esbuild: true
  protobufjs: false
  workerd: true

# @pierre/trees pins @pierre/theming 1.0.0, whose peer range predates the @pierre/theme 2.0.0 that
# @pierre/diffs installs; 1.0.1 only widens that range (same code). Drop once @pierre/trees moves past it.
overrides:
  '@pierre/trees>@pierre/theming': 1.0.1

patchedDependencies:
  pi-subagents@0.76.1: patches/pi-subagents@0.76.1.patch
