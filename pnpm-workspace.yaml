packages:
  - apps/*
  - packages/*

saveExact: true
engineStrict: true
minimumReleaseAgeExcludePrune: true
catalogPrune: true
catalogMode: prefer

catalog:
  typebox: 1.4.7
  react: 19.3.1
  react-dom: 19.3.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  lucide-react: 1.77.0
  motion: 14.14.0
  tailwindcss: 4.3.5
  vitest: 5.1.1
  oxc-transform-react: 0.156.0
  shiki: 4.6.0
  oxlint-tsgolint: 7.0.2008
  '@ziloen/remark-math': 0.1.2
  katex: 0.19.1
  mdast-util-math: 3.0.0
  rehype-katex: 7.0.1
  croner: 11.0.1
  radix-ui: 1.8.1
  openid-client: 6.9.1
  agent-base: 9.0.0
  http-proxy-agent: 9.1.0
  https-proxy-agent: 9.1.0
  undici: 8.13.1
  '@tanstack/react-hotkeys': 0.27.2
  diff: 9.0.0
  aws4fetch: 1.0.20
  marked: 18.2.1
  marked-cjk-friendly: 0.1.3
  embla-carousel-react: 8.6.0
  three: 0.187.0
  '@types/three': 0.187.0

allowBuilds:
  '@google/genai': false
  esbuild: true
  protobufjs: false
  workerd: true

overrides:
  # rehype-katex still requests vulnerable 0.16.x; use the same renderer as the imported CSS.
  'rehype-katex>katex': 0.19.1
  # Mermaid 11's math labels also use the patched renderer; the plugin still targets Mermaid 11.
  'mermaid>katex': 0.19.1
  # These SDKs pin an exact Undici release; keep one copy with the service's 8.x transport.
  '@earendil-works/pi-coding-agent>undici': 8.13.1
  'pi-subagents>undici': 8.13.1
  # pi-web-access pins 1.32.1; align its client with the service's SDK patch release.
  'pi-web-access>@modelcontextprotocol/sdk': 1.32.2

patchedDependencies:
  # Keep malformed loopback callback URLs from crashing OAuth sign-in and keep deterministic SIWC refusals non-retryable.
  '@earendil-works/pi-ai@1.6.1': patches/@earendil-works__pi-ai@1.6.1.patch
  # Preserve the app's summary output budgets; Pi 1.6 otherwise uses the model's full limit.
  '@earendil-works/pi-coding-agent@1.6.1': patches/@earendil-works__pi-coding-agent@1.6.1.patch
  pi-subagents@0.90.0: patches/pi-subagents@0.90.0.patch
  # Normalize fullscreen SVGs too and keep Flex from shrinking them before PanZoom fits them.
  streamdown@2.8.0: patches/streamdown@2.8.0.patch
